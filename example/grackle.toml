# The example site (DESIGN §7a): the falsifier for site-independence.
# A kitchen sink — each section exists to force a parked feature:
#   photos/   object views, hero, variants, dimension facts, masonry
#   manual/   §6e section trees, .section markers, q27 index-less dirs
#   recipes/  per-subtree schema (§5b), group_by over schema fields
#   _posts/   page outlines (§6e), toc: front matter, summaries
# Rule: this site never gets special-cased engine code.

root = "."

[site]
url = "https://example.grack.com"
baseurl = ""
title = "Field Notes"
author = "Example Author"

# ---------------------------------------------------------------- posts

# Named "notes", NOT "blog" — §7a contradiction #1, resolved: views now
# dispatch on collection *kind*, so the name is ours to choose.
[collections.notes]
kind = "posts"
source = "_posts"
crumb = "Notes"
index = "/blog/"
filename_formats = ["{year}-{month}-{day}-{slug}"]

  [[collections.notes.rules]]
  match = "**"
  defaults = { layout = "post" }
  route = "/blog/{year}/{month:02}/{day:02}/{slug}/"

# ---------------------------------------------------------------- objects

[collections.objects]
kind = "objects"
extensions = ["png", "jpg", "jpeg", "gif", "webp", "svg"]
bucket = "assets"

  [[collections.objects.rules]]
  match = "**"
  route = "/{path}"

# ---------------------------------------------------------------- pages

[collections.pages]
kind = "tree"
source = "."
exclude = ["themes/**", "*.toml"]

  # Theme is chosen per row (§5a); a rule default restyles a subtree —
  # the recipes section deliberately looks nothing like the rest.
  [[collections.pages.rules]]
  match = "recipes/**"
  defaults = { theme = "recipes" }

  [[collections.pages.rules]]
  match = "**/index.{html,md}"
  route = "/{dir}/"

  [[collections.pages.rules]]
  match = "**/*.{html,md}"
  front_matter = true
  route = "/{dir}/{stem}/"

  [[collections.pages.rules]]
  match = "**/*"
  route = "/{path}"

# ---------------------------------------------------------------- related

[related]
limit = 3
min_score = 0.3

# ---------------------------------------------------------------- views

[views.published]
over = "notes"
filter = "!draft && !hidden"

  [views.published.fields.summary]
  truncate = { max_blocks = 3, max_chars = 500 }

[views.blog_index]
over = "published"
paginate = 5
routes = ["/blog/", "/blog/page/{n}/"]
layout = "listing"
title = "Notes"

[views.latest]
over = "published"
limit = 3
layout = "link_list"

[views.tag_index]
over = "published"
group_by = "tags"
route = "/blog/tags/{key}/"
layout = "listing"
title = "Notes tagged “{key}”"
crumb = "{key}"

[views.feed]
over = "published"
limit = 20
route = "/atom.xml"
template = "atom.xml"

# The gallery (§5 audit, built): a view over the objects table. `match`
# scopes by path glob, `order_by` is declared (lexical-by-luck is not a
# contract), and the route replaces what was a hand-written index page.
[views.gallery]
over = "objects"
match = "photos/**"
order_by = "name"
route = "/photos/"
layout = "gallery"
title = "Photos"

# The book-of-the-month club (§7a): a view over TREE rows with typed
# fields (books/.schema.toml). Newest month leads — the card_list kind
# features the first member large.
[views.books]
over = "pages"
match = "books/**"
order_by = "-month"
route = "/books/"
layout = "card_list"
title = "Book of the Month"

# Routeless, embedded on the homepage: the same query language, composed
# across tables — posts (latest), pages (recipes, the current book).
[views.latest_recipes]
over = "pages"
match = "recipes/**"
filter = 'stem != "index"'
order_by = "title"
limit = 3
layout = "link_list"

[views.book_of_the_month]
over = "pages"
match = "books/**"
order_by = "-month"
limit = 1
layout = "card"

[views.sitemap]
over = "*"
route = "/sitemap.xml"
filter = '!draft && !hidden && (dir || ext == "html")'
