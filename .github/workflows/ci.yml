name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Caches ~/.cargo and ./target, including the ONNX runtime `ort`
      # fetches at build time, so only the first run pays for fastembed.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Default members only (no --workspace): grackle-search-wasm is a wasm
      # cdylib, built for wasm32 below, not on the host.
      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Build search-wasm (wasm32)
        run: cargo build --locked -p grackle-search-wasm --target wasm32-unknown-unknown
