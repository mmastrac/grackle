# The theme gallery's preview site.
#
# One server, eight themes and their subthemes, no restart — and since
# 2026-07-25, ONE content tree. The themes are an axis (q53): a post, a guide
# page or a shelf entry is a single row published at a route per look — the
# eight themes plus the showcase subthemes (`ledger:dark`, `miroir:rose`, …) —
# each rendering differently. `/vanilla/blog/one/` and `/ledger/blog/one/` are
# the same row, so "the same content in every look" is true by construction
# rather than by a copy per theme kept in step by hand.
#
# Every member wears its `{theme}` segment, canonical included: the axis says
# WHICH forms exist and the route template says where they land. `vanilla` is
# canonical, so every member points `rel="canonical"` at the vanilla URL and
# only it reaches the sitemap — the many looks of one document are not many
# documents.
#
# The three landings (blog, shelf, wall) merged too: a landing CLAIMS a
# content row, and the claim is keyed on the VIEW, so one view materialized
# across the axis claims one row. `blog/index.md` is written once and every
# theme's `/…/blog/` renders it — three landing files, not three per theme.
#
# `themes` is a symlink to ../../themes, the gallery itself, and `serve` watches
# through it — editing a token file re-renders every page here.
#
# This is a harness, not an example site — for the engine's own kitchen sink
# (i18n, objects, script shells, embeddings) see examples/field-notes.

root = "."

# No base config (§4d). This harness is atypical: its posts live at
# `/{theme}/blog/{slug}/` rather than the base's dated `/blog/…` paths, and the
# base's `published` set would fight the theme axis. The second live user of
# the escape hatch, after `examples/raw` — a site whose shape the base did not
# anticipate says so in one line instead of shadowing routes.
extends = "none"

# Declining the base means declining its vocabulary too (§4e): the flag family
# is ordinary declared schema, so a site that inherits nothing declares its own
# before filtering on it.
#
# Blog fields (`tags`, `date`, `description`) sit with the flags because posts
# wear them and `extends = "none"` declines the base's declarations. `toc` is
# here for guide pages (MERGE.md C1 / §4e). `shell` and `slot` join them for
# the rules below to write (IO.md I7c). `theme` is still NOT declared — the
# theme axis sets it per member at render, and declaring what nothing writes
# is how a vocabulary stops meaning anything.
[schema]
draft = { type = "bool" }
hidden = { type = "bool" }
noindex = { type = "bool" }
toc = { type = "bool" }
tags = { type = "list" }
description = { type = "string" }
date = { type = "date" }
slot = { type = "string" }
shell = { type = "string" }

# Declining the base also declines its head (§4e). This block is the base's,
# copied — which is the honest cost of `extends = "none"` and worth seeing in
# the repo next to a site that pays nothing for the same thing.
[html.head.meta]
description = 'description'
author = 'site.author'
viewport = '"width=device-width, initial-scale=1"'
robots = 'noindex ? "noindex,follow" : ""'

[html.head.property]
"og:title" = 'title'
"og:description" = 'description'
"og:url" = 'site.url + url'
# A row with a date is an article. The fact drives the value; nothing branches.
"og:type" = 'date ? "article" : "website"'
# `date` is ISO-8601 already, so the Atom-shaped timestamp is a concatenation
# rather than a function. Empty on an undated row, which emits no tag.
"article:published_time" = 'date ? date + "T00:00:00+00:00" : ""'
"article:author" = 'date ? site.author : ""'

[html.head.link]
canonical = 'site.url + url'
# `site.icon` is the first `/favicon.{svg,png,ico,webp,gif}` the tree fills.
# This site has none, so both expressions are empty and emit no tag — which is
# what makes copying them free, and is why the base can ship them for everyone.
icon = 'site.icon'
"shortcut icon" = 'site.icon'

[site]
url = "http://localhost:8083"
baseurl = ""
title = "Theme Gallery"
author = "grackle"

# ------------------------------------------------------------------ pages
#
# ONE content tree. The eight themes (and their subthemes) are an AXIS (q53)
# over it: one row, a route per look, each rendering differently. Before axes
# this site kept one byte-identical copy of every post, guide page and shelf
# entry per theme, because the only way to vary a row's theme was to vary the row.
#
# Every member wears its `{theme}` segment, canonical included
# (`/vanilla/blog/one/`, `/ledger/blog/one/`, `/miroir:rose/blog/one/`): the
# axis says WHICH forms exist and the route template below says where they
# land. `vanilla` is canonical, so every member points `rel="canonical"` at the
# vanilla URL and only it is in the sitemap: the many looks of one document are
# not many documents.

# The axis carries the eight themes AND their subthemes (§5a subselection): a
# value of `ledger:dark` renders `ledger` with `data-subtheme="dark"` stamped on
# <html>, so a subtheme is just another look on the same axis — no new theme, no
# new mechanism. The showcase set below adds a dark palette-swap, a geometry
# variant (marginalia:wide), miroir's three accent repaints and recipes:spicy;
# each lands at its own `/ledger:dark/…` route and joins the picker. The colon
# only ever appears in root-absolute URLs, so it is never read as a URL scheme.
[axes.theme]
values = [
  'vanilla',
  'ledger', 'ledger:dark',
  'marginalia', 'marginalia:wide',
  'terminal',
  'atlas',
  'miroir', 'miroir:rose', 'miroir:forest', 'miroir:slate',
  'almanac',
  'recipes', 'recipes:spicy',
]
field = "theme"

[[collections]]
source = "."
exclude = ["themes/**"]

  # The gallery's own landing publishes ONCE, at the root: it is the index of
  # the eight, not one of them. A rule that does not spend the axis opts its
  # rows out, which is the whole opt-in mechanism (q53 step 2).
  [[collections.rules]]
  match = "index.md"
  front_matter = true
  route = "/"

  # Everything else spends `{theme}`, so every row below lands eight times.
  #
  # The shell defaults below are the base's, on a site that declines the base
  # (IO.md I7c). The index rule declares none for the base's own reason: a
  # rule's defaults apply wherever it MATCHES, so a front-mattered `index.md`
  # takes `html` from the third rule and a static `index.html` would take `raw`
  # from the fourth — the same front-matter gate that decides everything else
  # about it.
  [[collections.rules]]
  match = "**/index.{html,md}"
  route = "/{theme}/{dir}/"

  [[collections.rules]]
  match = "**/*.{html,md}"
  front_matter = true
  route = "/{theme}/{dir}/{stem}/"
  defaults = { shell = "html" }

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"
  defaults = { shell = "raw" }

# ------------------------------------------------------------------ blog
#
# One posts collection, where there were six. The theme comes from the axis
# now, not from a rule default per collection. Routes are blog-shaped
# (`/{theme}/blog/{slug}/`) without the base's dated URL template, so the
# theme segment stays the first path part.

[[collections]]
name = "posts"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  # The glob names what this scope claims — markdown, and only markdown. A
  # scope owns its source (IO.md I7d), so what no rule here claims is not
  # content: an image sitting in `_posts/` is invisible rather than falling
  # through to the tree.
  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/{theme}/blog/{slug}/"
  defaults = { shell = "html" }

# ---------------------------------------------------------------- objects

# Membership is what this scope's rules claim (IO.md I7a): the extension list
# is the glob, case-insensitively. This site declines the base, so it says the
# objects rule's shell itself — an image leaves through the transparent one
# (IO.md I7e: one row constructor, so an object takes rule defaults like any
# other row, and this site's census reads `raw` rather than Null).
#
# The route is this site's own. `extends = "none"` means there is no base rule
# to silence, so this is simply the site saying where its wall and its covers
# land — the alternative being `embed = true` (IO.md §4a), which addresses them
# by content hash and publishes only what the galleries embed.
[[collections]]
name = "objects"

  [[collections.rules]]
  match = "**/*.{png,jpg,jpeg,gif,webp,svg}"
  route = "/{path}"
  defaults = { shell = "raw" }

# ------------------------------------------------------------------- sets

[sets.published]
from = "posts"
where = '!draft && !hidden'
order_by = "-date"

  [sets.published.fields]
  summary = 'truncate_chars(truncate_blocks(content, 1), 180)'

# Path scoping is a clause of the predicate, not a key of its own: `glob` is
# a registered filter function (§5f), so the subtree narrowing conjoins along
# `from` with everything else the chain says.
[sets.shelf]
from = "entries"
where = 'glob(path, "shelf/**") && !draft && !hidden'
order_by = "-date"

# ----------------------------------------------------------------- routes
#
# THREE landing declarations, where there were eighteen. Each is materialized
# across the theme axis, and the path spends it with a `{theme}` segment — the
# route decides where the axis lands, because that is where the rest of the URL
# is decided too.
#
# A landing CLAIMS a content row, and a row serves one landing — but that is
# keyed on the VIEW, so one view materialized across the axis claims one row.
# The per-theme copies of each landing's prose are gone with the per-theme
# declarations.

[routes.blog_index]
paths = ["/{theme}/blog/", "/{theme}/blog/page/{n}/"]
from = "published"
paginate = 2
layout = "card"
axis = "theme"
content = "blog/index.md"
title = "Blog"

[routes.shelf_index]
path = "/{theme}/shelf/"
from = "shelf"
layout = "card"
variant = "cards"
axis = "theme"
content = "shelf/index.md"
title = "Shelf"

[routes.wall_index]
path = "/{theme}/wall/"
from = "objects"
# The object vocabulary is file facts only, and `path` is one of them — so
# this type-checks while `where = "draft"` here still does not.
where = 'glob(path, "wall/**")'
order_by = "name"
layout = "card"
variant = "gallery"
axis = "theme"
content = "wall/index.md"
title = "Wall"

# `front_mattered` is what `kind == "post" || kind == "page"` always meant
# (IO.md §3): the documents, as opposed to byte copies and minted listings.
[routes.search]
path = "/search.bin"
shell = "search"
where = 'front_mattered && !draft && !hidden && stem != "index"'

[routes.sitemap]
path = "/sitemap.xml"
shell = "sitemap"
where = '!draft && !hidden && (dir || ext == "html")'
