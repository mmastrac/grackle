# The example site (DESIGN §7a): the falsifier for site-independence.
# A kitchen sink — each section exists to force a parked feature:
#   photos/   object views, hero, variants, dimension facts, masonry
#   manual/   §6e section trees, .section markers, q27 index-less dirs
#   recipes/  per-subtree schema (§5b), group_by over schema fields
#   _posts/   page outlines (§6e), toc: front matter, summaries
# Rule: this site never gets special-cased engine code.

root = "."

[site]
url = "https://example.grack.com"
baseurl = ""
title = "Field Notes"
author = "Example Author"
# `themes/` is a symlink to the shared gallery (../../themes), so the house
# style is named rather than picked up from an implicit `default` directory:
# `almanac` is this site's serif reading theme, and `recipes/**` restyles to
# `recipes` per rule below. Both live in the gallery now, previewed alongside
# the other six under examples/theme-preview.
theme = "almanac"

# ---------------------------------------------------------------- posts

# Named "notes", NOT "blog" — §7a contradiction #1, resolved: views now
# dispatch on collection *kind*, so the name is ours to choose.
[[collections]]
name = "notes"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}.{axis:locale}", "{date.year}-{date.month}-{date.day}-{slug}"]

  # The glob names what this scope claims — markdown, and only markdown. A
  # scope owns its source (IO.md I7d), so what no rule here claims is not
  # content: an image sitting in `_posts/` is invisible rather than falling
  # through to the tree.
  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = [
    "/{axis:locale}/blog/{year}/{month:02}/{day:02}/{slug}/",
    "/blog/{year}/{month:02}/{day:02}/{slug}/",
  ]

  # Related notes (§6g). No recency penalty here (a small corpus), just the
  # embedding order with a floor — overrides the base's `related` by name;
  # `earlier`/`later`/`linked_from` stay inherited from base.toml.
  [collections.relations.related]
  where    = "!(candidate in earlier) && !(candidate in later) && !(candidate in links_to)"
  rank     = "embedding_similarity(self, candidate)"
  min_rank = 0.3
  limit    = 3

# ---------------------------------------------------------------- objects

# Membership is what this scope's rules claim (IO.md I7a): the extension list
# is the glob, case-insensitively.
#
# The route is this site's own, and since I11 that is the whole story: the base
# declines to route images (`embed = true`, IO.md §4a), so a site that wants
# literal asset paths — bookmarkable, linkable, what `photos/p01.png` has always
# meant here — says so in one line, and first-writer-wins silences the base's.
# Delete it and these twelve photos would publish only at their `/static/`
# content addresses, reachable by the galleries that embed them and by nothing
# else.
[[collections]]
name = "objects"

  [[collections.rules]]
  match = "**/*.{png,jpg,jpeg,gif,webp,svg}"
  route = "/{path}"

# ---------------------------------------------------------------- pages

[[collections]]
source = "."
# `shells/**` is build tooling, not content (§4c): a script shell's source
# is input to the build, and without this the engine routed it as a static
# page and served llms.py to the public. `*.toml` used to be here for the
# config file itself; the engine excludes that by identity now.
exclude = ["themes/**", "shells/**"]
file = ["{stem}.{axis:locale}", "{stem}"]

  # Theme is chosen per row (§5a); a rule default restyles a subtree —
  # the recipes section deliberately looks nothing like the rest.
  [[collections.rules]]
  match = "recipes/**"
  defaults = { theme = "recipes" }

  [[collections.rules]]
  match = "**/index.{html,md}"
  route = ["/{axis:locale}/{dir}/", "/{dir}/"]

  [[collections.rules]]
  match = "**/*.{html,md}"
  front_matter = true
  route = ["/{axis:locale}/{dir}/{stem}/", "/{dir}/{stem}/"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

  # A relation the base never shipped (§6g): recipes in the same course.
  # `scope` narrows it to the recipes subtree AND names the schema
  # `self.course` type-checks against — `course` is a recipes-only
  # `.schema.toml` field, so a whole-tree schema would reject it. The key does
  # both jobs, which is why it is not spelled `match`. Nearest by title, a
  # stand-in for "most similar" without embeddings on pages; the distance
  # wears a minus sign because bigger always wins. `linked_from` is inherited
  # from base on the tree; earlier/later/related stay posts-only.
  [collections.relations.same_course]
  from  = "recipes"
  scope = "recipes/**"
  where = "candidate.course == self.course"
  rank  = "-levenshtein(self.title, candidate.title)"
  limit = 3
  label = "@same_course"

# ---------------------------------------------------------------- links

# §6a row/view links: this site links rows by SOURCE PATH and views by
# view: reference — URLs are derived values here (locales, slugs, route
# templates), so raw internal URLs are load errors that answer with the
# correct form. That is `policy = "strict"`, the default since 2026-07-20,
# so this site declares no [links] block at all. `policy = "loose"` is the
# escape hatch for importing a corpus that has not been converted yet.

# ---------------------------------------------------------------- locale

# Locale is an ordinary axis. Rules spend it into `file =` (suffix form) and
# into routes; missing translation files simply do not materialize.
[axes.locale]
values = ["en", "fr"]
field = "locale"

[i18n.names]
en = "English"
fr = "Français"

# The GLOBAL string map (§6f): the fallback layer of the display-name
# hierarchy — inline beats global beats engine built-in. Engine keys
# (home, related, …) override what the engine emits; any other key is a
# shared string for "@key" references, and must be referenced somewhere
# (an unused key is a load error — it's how a typo'd engine key surfaces).
[i18n.strings]
home = { en = "Home", fr = "Accueil" }
related = { en = "Related", fr = "Similaires" }
later = { en = "Later post", fr = "Note suivante" }
earlier = { en = "Earlier post", fr = "Note précédente" }
linked_from = { en = "Linked from", fr = "Lié depuis" }
translations = { en = "Translations", fr = "Traductions" }
# A site-defined relation's label (§6g): not engine vocabulary, so it lives
# here and the `same_course` relation references it with `label = "@same_course"`.
same_course = { en = "Same course", fr = "Même plat" }
# A shared string: referenced by tag_index below as title = "@tagged".
tagged = { en = "Notes tagged “{key}”", fr = "Notes étiquetées « {key} »" }

# Enum records (§6f, generalized 2026-07): `[records.<field>.<id>]`
# declares the value domain of any grouped field — the tag-records
# pattern, no longer tags-only. Slug and name default to the id; `name`
# carries the lang axis and renders wherever the value is DISPLAYED
# (pills, `{key}` in grouped titles/crumbs) while routes wear the slug;
# `intro` is the value's own landing prose, picked up by its archive
# page (q45 mode A, per key).
[records.tags.meta]
name = { en = "meta", fr = "méta" }

[records.course.dinner]
name = { en = "Dinner", fr = "Dîner" }
intro = { en = "These dinner recipes are sure to please!", fr = "Des dîners qui font plaisir, à coup sûr." }

[records.course.baking]
name = { en = "Baking", fr = "Fournée" }
intro = { en = "Flour, patience, and a hot oven.", fr = "De la farine, de la patience et un four bien chaud." }

# ------------------------------------------------------------------ sets
#
# Queries that never land. `from` names a collection, a set, or a route.

[sets.published]
from = "notes"
where = "!draft && !hidden"
# Newest first. The engine orders by path unless a set says otherwise —
# a tree is a list of files, and dates are a thing posts have.
order_by = "-date"

  [sets.published.fields.summary]
  truncate = { max_blocks = 3, max_chars = 500 }

[sets.latest]
from = "published"
limit = 3
layout = "link"

# The corpus queries, named once. `where` and `order_by` flow to every
# consumer along `from` — the predicate CONJOINS (a child narrows, never
# widens), the sort is nearest-wins. Before this the three recipe consumers
# each restated all three clauses, so a re-sort of /recipes/ silently
# desynced the homepage block.
# `!draft && !hidden` on a TREE set, which was not expressible until the
# flag family joined the page schema — the flags cascaded onto every page
# and reached its route, but no query could name them.
# Path scoping is a clause like any other: `glob(path, …)` is a registered
# function (§5f), so the subtree narrowing rides the same conjunction and is
# type-checked by the same pass. There is no `match` key on a view.
[sets.recipes]
from = "entries"
where = 'glob(path, "recipes/**") && !draft && !hidden'
order_by = "title"

[sets.books]
from = "entries"
where = 'glob(path, "books/**") && !draft && !hidden'
order_by = "-date"

[sets.latest_recipes]
from = "recipes"
limit = 3
layout = "link"

[sets.book_of_the_month]
from = "books"
limit = 1
layout = "card"
variant = "card"

# ---------------------------------------------------------------- routes
#
# Every URL this site emits from a query. `path` is what makes it a route.

[routes.blog_index]
paths = [
  "/{axis:locale}/blog/",
  "/blog/",
  "/{axis:locale}/blog/page/{n}/",
  "/blog/page/{n}/",
]
from = "published"
paginate = 5
layout = "card"
title = { en = "Notes", fr = "Carnet" }

[routes.tag_index]
paths = ["/{axis:locale}/blog/tags/{key}/", "/blog/tags/{key}/"]
from = "published"
group_by = "tags"
# §6f: pairing-axis partition is DEFAULT-ON — /fr/blog/tags/…
# holds the French rows, titled from @tagged's fr entry, with no
# annotation here. A view that should stay on the canonical member
# opts out with partition = "default". A tag with no French rows has
# no French page.
layout = "card"
noindex = true
# A "@key" reference into [i18n.strings] — the title is declared once,
# per locale, and any view could share it. Placeholders render after the
# locale resolves.
title = "@tagged"
crumb = "{key}"

[routes.feed]
paths = ["/{axis:locale}/atom.xml", "/atom.xml"]
from = "published"
limit = 20
# `shell` is the serialization, declared rather than inferred from a
# filename (q44). No `template`: that key names a SOURCE file a view claims
# so the tree walk leaves it unrouted, and this feed is rendered from the
# rows — there is no atom.xml here to claim (MERGE.md D1).
shell = "atom"

# A script shell (§5g — the pun is the point): a registered shell type
# backed by a command. The view's rows arrive as grackle-shell/0 JSON on
# stdin; stdout lands at the route verbatim. The experimental bench —
# this one prototypes /llms.txt before the md shell is a built-in.
[shells.llms]
command = "python3 shells/llms.py"

[routes.llms]
paths = ["/{axis:locale}/llms.txt", "/llms.txt"]
from = "published"
shell = "llms"

# Search spans tables (§5g): notes AND every rendered page — recipes, books,
# the manual — because the searchable set is a route-schema query, not a
# hardcoded projection of the posts table. `stem != "index"` keeps
# listing-shaped pages (the homepage, section indexes) out: they would
# match every term their link titles mention.
#
# `front_mattered` is what `kind == "post" || kind == "page"` always meant
# (IO.md §3): a document the author gave identity to, as opposed to bytes
# copied verbatim or a listing the engine minted.

[routes.search]
path = "/search.bin"
shell = "search"
where = 'front_mattered && !draft && !hidden && stem != "index"'

# The gallery (§5 audit, built): a view over the objects table. `where`
# scopes by path glob — `path` is a column of the OBJECT vocabulary, which is
# why the narrow schema still type-checks this and would still refuse
# `draft` — `order_by` is declared (lexical-by-luck is not a contract), and
# the route replaces what was a hand-written index page.

[routes.gallery]
path = "/photos/"
from = "objects"
where = 'glob(path, "photos/**")'
order_by = "name"
layout = "card"
variant = "gallery"
title = "Photos"

# The book-of-the-month club (§7a): a view over TREE rows with typed
# fields (books/.schema.toml). Newest month leads; the theme's
# `:first-child` card rule makes it the selection. `variant` picks the
# face (q24/q36) — /books/ and /blog/ are both listings, wearing
# different fragments.

[routes.books_index]
paths = ["/{axis:locale}/books/", "/books/"]
from = "books"
layout = "card"
variant = "cards"
title = { en = "Book of the Month", fr = "Le livre du mois" }
# q45 mode A: declared prose in the listing layout's intro slot — a
# LocalizedStr rendered as markdown through the link resolver, so the
# view: link below is validated at build like any body link, and resolves
# per locale (/blog/ or /fr/blog/) from this one declaration.
intro = { en = "One book a month, argued with, shelved beside the [notes](view:blog_index).", fr = "Un livre par mois, discuté, rangé à côté du [carnet](view:blog_index)." }

# The recipes landing (q45 mode B): /recipes/ is a VIEW that claims its
# content row. The row (recipes/index.md) owns the arrangement — its
# prose places {% view recipes_index %}, and that embed is route-aware:
# /fr/recipes/ materializes from the French rows with index.fr.md's
# prose. Claiming retired the stem != "index" filters below: a claimed
# row leaves every query structurally.

[routes.recipes_index]
paths = ["/{axis:locale}/recipes/", "/recipes/"]
from = "recipes"
layout = "card"
content = "recipes/index.md"
title = { en = "Recipes", fr = "Recettes" }

# Recipes grouped by a schema field — group_by = "course" is the SAME
# operation as group_by = "tags": group by a typed field. The date specs
# were always aliases for the year/month fields.
# Course archives live UNDER the recipes landing (Matt, 2026-07): the
# nested URL is what makes the trail climb — Home › Recipes › Dinner
# falls out of the q45 landing chain, no declaration. {key} renders the
# course record's localized name; the URL wears its slug.

[routes.recipes_by_course]
paths = ["/{axis:locale}/recipes/courses/{key}/", "/recipes/courses/{key}/"]
from = "recipes"
group_by = "course"
layout = "card"
variant = "cards"
title = { en = "Recipes: {key}", fr = "Recettes : {key}" }
crumb = "{key}"

# Routeless, embedded on the homepage: the same query language, composed
# across tables — posts (latest), pages (recipes, the current book).

[routes.sitemap]
path = "/sitemap.xml"
shell = "sitemap"
where = '!draft && !hidden && (dir || ext == "html")'
