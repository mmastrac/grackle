# One query, two looks (DESIGN.md §5a, §5c).
#
# A listing takes the theme its member rows agree on, and a claimed landing
# takes its claimed row's — both of which make the theme a property of the
# CONTENT. So the only way to render one query under two looks was to keep two
# copies of the rows, which is exactly what `theme-preview/` was doing with six.
#
# A view may name its own theme now. Both routes below range over the SAME set
# and the same four posts; they differ by URL and by look.
extends = "none"

[site]
url = "https://example.com"
title = "Two Looks"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[schema]
date = { type = "date" }
draft = { type = "bool" }
hidden = { type = "bool" }

[[collections]]
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/notes/{slug}/"

[[collections]]
source = "."
exclude = ["themes/**"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[sets.published]
from = "posts"
where = "!draft && !hidden"
order_by = "-date"

# No theme named: the members agree on nothing, so this is the site default.
[routes.plain]
path = "/plain/"
from = "published"
layout = "card"
title = "Plain"

# The same rows, wearing a theme the route chose. Subtheme tokens ride along
# exactly as a row's do.
[routes.loud]
path = "/loud/"
from = "published"
layout = "card"
theme = "loud:dark"
title = "Loud"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
