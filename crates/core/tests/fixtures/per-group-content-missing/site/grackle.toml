# Per-group `content` (§5c): a grouped view mints one route per group, and a
# TEMPLATED `content` gives each its own words. `content = "{group:key}/index.md"`
# resolves per route — `/alpha/` embeds `alpha/index.md`, `/beta/` embeds
# `beta/index.md` — so one declaration gives two landings their own prose, where
# before a landing could claim only one fixed row.
#
# Each claimed row loses its own standalone route (the landing owns the URL) and
# leaves every query, exactly as a literal claim does — only settled after the
# routes exist, because the group keys are not known until then. The claim is a
# PROMISE: a group whose `{key}/index.md` is missing is a load error (see the
# `per-group-content-missing` fixture).
extends = "none"

[html.head.link]
canonical = 'site.url + url'

[site]
url = "https://example.com"
title = "Per-group content"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[schema]
date = { type = "date" }
draft = { type = "bool" }
hidden = { type = "bool" }
topic = { type = "string" }

[[collections]]
name = "posts"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{slug}/"

# The tree holds the per-group landing bodies. Each `<key>/index.md` would land
# at `/<key>/` on its own — the same URL its group's view route claims — but the
# claim withholds that standalone route, so there is no collision.
[[collections]]
name = "entries"
source = "."

  [[collections.rules]]
  match = { pattern = "*/index.md", front_matter = true }
  route = "/{dir}/"

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[views.topics]
path = "/{group:key}/"
from = "posts"
where = "!draft && !hidden"
group_by = "topic"
layout = "card"
content = "{group:key}/index.md"
title = "{group:key}"
