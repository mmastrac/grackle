# The i18n axis need not be named `locale`. `[axes.lang]` + `[i18n] axis =
# "lang"` drives pairing, hreflang expand, and single-locale indexes with no
# engine spelling of "locale".
extends = "none"

[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[site]
url = "https://example.com"
title = "Renamed i18n axis"
author = "Tester"

[schema]
lang = { type = "string" }

[i18n]
axis = "lang"

[html.head.link]
alternate = { from = "axis.lang", hreflang = 'lang', href = 'site.url + url' }
canonical = 'site.url + url'

[html.html.attribute]
lang = 'lang'

[axes.lang]
values = ["en", "fr"]
field = "lang"

[[collections]]
source = "."
file = ["{axis:lang}/{stem}", "{stem}"]

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = ["/{axis:lang}/{dir}/{stem}/", "/{dir}/{stem}/"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
