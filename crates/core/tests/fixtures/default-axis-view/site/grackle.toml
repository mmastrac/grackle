# The default-axis case on a VIEW: a listing materialized across the `look` axis
# with a path list. The canonical member (plain) drops its segment via the
# shorter template, so the listing lands at `/all/`; the alternate at `/fancy/all/`.
extends = "none"

[site]
url = "https://example.com"
title = "Default axis view"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[axes.look]
values = ["plain", "fancy"]
field = "look"

[schema]
date = { type = "date" }

[[collections]]
name = "posts"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{slug}/"

[views.hub]
from = "posts"
layout = "card"
axis = "look"
paths = ["/{look}/all/", "/all/"]
title = "All"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
