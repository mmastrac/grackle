# Two files in one `.slots/` filling one slot.
#
# `.slots/copyright.md` and `.slots/copyright.html` both key on the stem
# `copyright`. The extension picks the pipeline — `.md` renders through
# comrak, `.html` is trusted verbatim (§5e) — so these are two different
# fills of one name, and `SlotFills::resolve` walks *directory levels*:
# nearest-wins ranks levels and has nothing to say about two files at one
# level. The winner used to be whichever `read_dir` handed over last.
#
# Delete the `bail!` in `slots::load_dir` and this site builds again, with the
# footer's copyright line decided by directory-iteration order.
#
# (This collision is invisible to grack.com's own build: the `.slots/` walk
# skips `grackle/` outright, unlike the declaration walk R1/R2 had to teach.)
extends = "none"

[site]
url = "https://example.com"
title = "Two Fills"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[[collections]]
source = "."

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{dir}/{stem}/"
