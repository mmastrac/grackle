# Two subtrees, one field name, two types.
#
# `books/.schema.toml` says `series` is an int; `notes/.schema.toml` says it
# is a string. Neither directory is inside the other, so §5b's nearest-wins
# has nothing to rank them by — yet `Schemas::declared()` must flatten both
# into ONE site-wide filter vocabulary, and it used to do that with
# `or_insert` over a `BTreeMap<PathBuf>`: alphabetical directory order,
# silently. `books` sorted first, so the whole site's `where`/`order_by`/
# `group_by` saw `series` as an int, while every row under `notes/` carried a
# string.
#
# Delete the collision check in `Schemas::add` and this site loads again —
# with exactly that lie in place.
extends = "none"

[site]
url = "https://example.com"
title = "Two Subtrees"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[[collections]]
source = "."

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{dir}/{stem}/"
