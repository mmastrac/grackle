# The NEAREST rung of the theme ladder (MERGE.md table C): an axis member's
# field, set on the row at render time.
#
# `[axes.theme] field = "theme"` means every one of its values IS a theme
# spec — `axis_field(r, "theme")` beats the row's own in all five render
# paths — and nothing validated them anywhere. A typo here multiplied the URL
# space first and failed at render second, with the theme named and neither
# the axis nor the value's position named.
#
# The `field` itself is deliberately NOT checked against anything (q53: a
# member may differ purely presentationally, so no field is inert). It is the
# value that has to answer, and only when the field is one the engine reads.
extends = "none"

[site]
url = "https://example.com"
title = "Unknown Theme, On An Axis"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[[collections]]
source = "."
exclude = ["themes/**"]

  # The rule that spends the axis is the rule that opts its rows in.
  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{theme}/{stem}/"

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

# `loud` exists; `nosuch` does not, and would have rendered a whole member of
# the axis — every row, at its own URL — through a theme that is not there.
[axes.theme]
values = ["loud", "nosuch"]
field = "theme"
