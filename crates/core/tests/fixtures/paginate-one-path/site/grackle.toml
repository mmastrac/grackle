# A paginated view with ONE path (DESIGN.md §5c).
#
# Page 2 would render the same URL as page 1. Before the grouped-and-paginated
# work this was two silent failures depending on which key you used: `paths`
# with one entry fell back to the page-1 template and collided, and `path`
# alone left `v.routes` empty so the paginated branch emitted no routes at all
# — a view that asked to paginate and produced nothing, with no complaint.
extends = "none"

[site]
url = "https://example.com"
title = "Paginated"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[schema]
date = { type = "date" }
draft = { type = "bool" }
hidden = { type = "bool" }

[[collections]]
name = "posts"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{year}/{slug}/"

[[collections]]
name = "entries"
source = "."

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[views.blog_index]
path = "/blog/"
from = "posts"
paginate = 1
layout = "card"
