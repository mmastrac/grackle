# A gallery over the objects table, and the two things that must NOT be in it.
#
# This replaces `views.rs::object_view_tests`, which hand-wired `db.object_ix`
# and `db.page_ix` — the internal membership lists a fixture never has to know
# about — with a comment admitting the hazard: "a fixture that omits this is a
# row the view cannot see". Here the files are real, so membership is whatever
# the loader decides, which is the thing actually under test.
#
# Two exclusions are visible in the blessed output by their absence:
#
#   assets/x.png    an object OUTSIDE the view's `glob(path, …)` clause
#   photos/note.md  a CONTENT row inside it — with one row store, a gallery
#                   that forgot its membership filter would pick this up
extends = "none"

[site]
url = "https://example.com"
title = "Gallery"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[[collections]]
name = "objects"

  [[collections.rules]]
  match = "**/*.png"
  route = "/{path}"

[[collections]]
source = "."

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{dir}/{stem}/"

# `order_by` is declared: lexical-by-luck is not a contract. The path scope is
# a `where` clause — `path` is a column of the OBJECT schema, so
# the narrow vocabulary type-checks it and still refuses `draft`.
[routes.gallery]
path = "/photos/"
from = "objects"
where = 'glob(path, "photos/**")'
order_by = "name"
layout = "card"
title = "Photos"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
