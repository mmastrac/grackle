# Locale as a directory prefix: `fr/recipes/dal.md` is the French member of
# `recipes/dal.md`. Same `file =` list law as the suffix form — the pattern
# spends the axis; rules match the logical path after the strip. Routes spend
# `{axis:locale}` the same way (no engine prefix fallback).
extends = "none"

[site]
url = "https://example.com"
title = "Locale prefix"
author = "Tester"


[schema]
locale = { type = "string" }

[html.head.link]
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }

[html.html.attribute]
lang = 'locale'

[axes.locale]
values = ["en", "fr"]
field = "locale"

[[collections]]
source = "."
file = ["{axis:locale}/{stem}", "{stem}"]

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = ["/{axis:locale}/{dir}/{stem}/", "/{dir}/{stem}/"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"
