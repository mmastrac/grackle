# Locale as a directory prefix: `fr/recipes/dal.md` is the French member of
# `recipes/dal.md`. Same `file =` list law as the suffix form — the pattern
# spends the axis; rules match the logical path after the strip. Routes spend
# `{axis:locale}` the same way (no engine prefix fallback).
extends = "none"

[site]
url = "https://example.com"
title = "Locale prefix"
author = "Tester"



[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[schema]
locale = { type = "string" }

[html.head.link]
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }

[html.html.attribute]
lang = 'locale'

[axes.locale]
values = ["en", "fr"]
field = "locale"

[[collections]]
name = "entries"
source = "."
file = ["{axis:locale}/{stem}", "{stem}"]

  [[collections.rules]]
  match = { pattern = "**/*.md", front_matter = true }
  route = ["/{axis:locale}/{dir}/{stem}/", "/{dir}/{stem}/"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
