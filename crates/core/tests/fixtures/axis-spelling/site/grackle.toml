# The namespaced `{axis:name}` spelling, and the two ways a link
# names a member of a path list.
#
# The axis is spent the namespaced way EVERYWHERE — a row rule's list and a
# view's — because that is the spelling the engine used to accept in one place
# and reject in another: `spends()` read both, while the view loader's
# declared-but-never-spent check and the link resolver each carried a bare
# `{look}` string of their own.
#
#   look=plain (canonical)  ->  /note/        and  /all/
#   look=fancy              ->  /fancy/note/  and  /fancy/all/
#
# The canonical member drops its segment to the shorter template, which is what
# makes this fixture the one that catches a reconstructed URL: rebuilding a
# member's address from the rule's FIRST template answers `/{axis:look}/note/`,
# a URL the build never issued. `index.md` links every member both ways, so its
# rendered hrefs are the assertion.
extends = "none"

[site]
url = "https://example.com"
title = "Axis spelling"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[axes.look]
values = ["plain", "fancy"]
field = "look"

[[collections]]
source = "."

  # A path LIST (§6f, the default-axis case): the shortest template that still
  # spends every non-canonical axis wins, so `plain` lands at `/note/`.
  [[collections.rules]]
  match = "note.md"
  front_matter = true
  route = ["/{axis:look}/note/", "/note/"]

  [[collections.rules]]
  match = "index.md"
  front_matter = true
  route = "/"

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[routes.hub]
from = "entries"
layout = "card"
axis = "look"
paths = ["/{axis:look}/all/", "/all/"]
title = "All"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
