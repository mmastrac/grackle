	<div data-slot="content"><p>Row links, naming a member of a path list:</p>
<ul>
<li><a href="/note/">the canonical note</a></li>
<li><a href="/fancy/note/">the fancy note</a></li>
</ul>
<p>View links, the same spelling:</p>
<ul>
<li><a href="/all/">all, canonical</a></li>
<li><a href="/fancy/all/">all, fancy</a></li>
</ul>
<p>Only a declared axis name is a selector, so these stay literal:</p>
<ul>
<li><a href="/note/?utm=x">an ordinary query</a></li>
<li><a href="/note/?lok=fancy">a misspelled axis</a></li>
</ul>
