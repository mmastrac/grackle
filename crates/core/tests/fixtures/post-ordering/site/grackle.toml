# Ordering, as three listings over one corpus.
#
# This replaces `views.rs::posts_order_tests`, which built four `Row` values
# by hand — including the `locale`, `rel` and `rendered` fields that comments
# had to flag as load-bearing, because a fixture omitting one produced a row
# the view could not see. That test could not have caught a bug in the loader
# it was imitating. This one runs it.
#
# `extends = "none"` keeps the blessed output to the three pages under test.
extends = "none"

[site]
url = "https://example.com"
title = "Ordering"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[schema]
date = { type = "date" }

[[collections]]
name = "notes"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/notes/{slug}/"

# No `order_by`: path order, NOT newest-first. A posts collection asks for
# dates rather than assuming them.
[views.by_path]
path = "/by-path/"
from = "notes"
layout = "card"
title = "By path"

[views.by_date_desc]
path = "/by-date-desc/"
from = "notes"
order_by = "-date"
layout = "card"
title = "By date, newest first"

# `path` is the last key, always — so `b` and `c`, which declare no `order`
# and tie at Null, fall through to their filenames rather than to whatever
# the tree walk happened to yield.
[views.by_order]
path = "/by-order/"
from = "notes"
order_by = "order"
layout = "card"
title = "By declared order"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
