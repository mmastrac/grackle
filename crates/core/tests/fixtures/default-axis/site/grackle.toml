# The default-axis case (§6f): a LIST of route templates, one per default-ness
# combination. The engine picks the shortest template that still spends every
# NON-canonical axis, so a member at its canonical value drops its segment.
#
#   look=plain (canonical), locale=en (default)  -> /            (spends nothing)
#   look=fancy,             locale=en            -> /fancy/      (spends look)
#   look=plain,             locale=fr            -> /plain/fr/   (only the full
#                                                    template covers locale)
#   look=fancy,             locale=fr            -> /fancy/fr/   (spends both)
#
# `{axis:locale}` is a positionable spent token here, not a forced prefix.
extends = "none"

[site]
url = "https://example.com"
title = "Default axis"
author = "Tester"



[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[schema]
locale = { type = "string" }

[html.head.link]
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }

[html.html.attribute]
lang = 'locale'

[axes.locale]
values = ["en", "fr"]
field = "locale"

[axes.look]
values = ["plain", "fancy"]
field = "look"

[[collections]]
source = "."
file = ["{stem}.{axis:locale}", "{stem}"]

  [[collections.rules]]
  match = "note*.md"
  front_matter = true
  route = ["/{look}/{axis:locale}/", "/{look}/", "/"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
