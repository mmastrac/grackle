<!doctype html>
<html data-kind="root" lang="fr">
<head>
	<title>Blog</title>
	<meta charset="utf-8">
	<link href='/css/main.css' rel='stylesheet' type='text/css'>
</head>
<body>
<header data-frame>
	<a href="/" data-slot="site_title">Locale listing</a>
	
	<nav aria-label="Other versions" data-slot="axes">
		<details data-axis="locale" aria-label="Translations" data-kind="axis">
			<summary data-slot="current">Français</summary>
			<div data-slot="items">
				<a href="/blog/" data-kind="axis_member">
					<span data-slot="label">English</span>
				</a>
			
				<a href="/fr/blog/" data-current="true" data-kind="axis_member">
					<span data-slot="label">Français</span>
				</a>
			</div>
		</details>
	</nav>
</header>
<main data-frame data-slot="content"><article data-kind="row">
	<nav aria-label="Breadcrumbs" data-slot="crumbs">
		<span data-kind="crumb"><a href="/" data-slot="label">Home</a></span>
	
		<span data-kind="crumb"><a data-slot="label">Blog</a></span>
	</nav>
	<header>
		<h1 data-slot="title">Blog</h1>
		
	</header>
	
	
	
	
	<div data-slot="content"><article data-kind="row">
	<h2><a href="/fr/blog/hello/" data-slot="title">Bonjour</a></h2>
	<p><time datetime="2026-01-01" data-slot="date_pretty">1 January 2026</time> </p>
	
	<div data-slot="content"><p>Billet français.</p>
</div>
</article>
</div>
	
	
</article>
</main>
</body>
</html>
