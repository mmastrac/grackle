# q47: a listing view renders a language switcher. A French reader on /fr/blog/
# gets a way back to /blog/ — the axis slot, computed for the view route from its
# own routes in other locales (the same mechanism a row uses through by_logical).
extends = "none"

[site]
url = "https://example.com"
title = "Locale listing"
author = "Tester"



[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[schema]
date = { type = "date" }
locale = { type = "string" }

[html.head.link]
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }

[html.html.attribute]
lang = 'locale'

[axes.locale]
values = ["en", "fr"]
field = "locale"

[i18n.names]
en = "English"
fr = "Français"

[[collections]]
name = "posts"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}.{axis:locale}", "{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = ["/{axis:locale}/blog/{slug}/", "/blog/{slug}/"]

[views.blog]
paths = ["/{axis:locale}/blog/", "/blog/"]
from = "posts"
layout = "card"
title = "Blog"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
