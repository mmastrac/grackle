# Locale composes with another axis (q53's last edge). `note.md` and
# `note.fr.md` are the en and fr members of the locale axis; the rule spends a
# `look` axis too, so each locale is rendered in each look — the cartesian
# product `/{look}/note/` × locale = `/plain/note/`, `/fancy/note/`,
# `/fr/plain/note/`, `/fr/fancy/note/`. Locale is the outer axis (the prefix),
# the look the inner, and a translation is just the fr member owning its file.
extends = "none"

[schema]
locale = { type = "string" }

[html.head.link]
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }

canonical = 'site.url + url'

[site]
url = "https://example.com"
title = "Locale x axis"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[html.html.attribute]
lang = 'locale'

[axes.locale]
values = ["en", "fr"]
field = "locale"

[axes.look]
values = ["plain", "fancy"]
field = "look"

[[collections]]
name = "entries"
source = "."
file = ["{stem}.{axis:locale}", "{stem}"]

  [[collections.rules]]
  match = { pattern = "note*.md", front_matter = true }
  route = ["/{axis:locale}/{look}/note/", "/{look}/note/"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

