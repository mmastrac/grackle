# The route `kind` column is a closed enum, so a value outside it is a load
# error naming the knowns rather than a filter that matches nothing for as long
# as the config lives. `posts` is the near-miss: it is the
# plural habit — the value is `post`, singular — and the domain check catches it.
[site]
url = "https://example.com"
title = "A Fixture"
author = "Tester"

[routes.search]
path = "/search.bin"
shell = "search"
where = 'kind == "posts"'
