# `require = true` on a shell expand: once routes materialize the pool must
# be non-empty, so a site that demands its feed link fails loudly instead of
# shipping heads without it. `extends = "none"` because the base declares
# `[views.feed]`, which would satisfy the requirement.
extends = "none"

[site]
url = "https://example.com"
title = "A Fixture"
author = "Tester"

[schema]
date = { type = "date" }

[[collections]]
name = "posts"
source = "_posts"

[[collections.rules]]
match = "**"
route = "/blog/{year}/{month:02}/{slug}/"

[html.head.link]
feed = { where = "shell == 'atom'", require = true, rel = '"alternate"', type = '"application/atom+xml"', href = 'site.url + url' }
