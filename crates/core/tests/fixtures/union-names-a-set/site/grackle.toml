# A union naming a SET (DESIGN.md §5c). A union ranges over collections; it is
# not a general "union of two queries", which is a query operation this does not
# attempt. The error says how to narrow a set instead — compose over it.
extends = "none"

[site]
url = "https://example.com"
title = "Union"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[schema]
date = { type = "date" }

[[collections]]
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{slug}/"

[[collections]]
source = "."

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[routes.everything]
path = "/all/"
from = ["posts", "recent"]
layout = "card"

[sets.recent]
from = "posts"
limit = 3
