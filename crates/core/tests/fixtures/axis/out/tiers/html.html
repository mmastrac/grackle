<!doctype html>
<html data-kind="root" data-axis-serialization="html" style="--axis-serialization:&quot;html&quot;">
<head>
	<title>Tiers</title>
	<link rel="canonical" href="https://example.com/tiers/html.html">
	<link rel="alternate" href="https://example.com/tiers/light_html.html">
	<meta charset="utf-8">
	<link href='/css/main.css' rel='stylesheet' type='text/css'>
</head>
<body>
<script>try{var s=localStorage.getItem('grackle:scheme');if(s=='dark'||s=='light'){var h=document.documentElement,t=(h.getAttribute('data-subtheme')||'').split(' ').filter(function(x){return x&&x!='dark'&&x!='light'});t.push(s);h.setAttribute('data-subtheme',t.join(' '))}}catch(e){}</script>

<header data-frame>
	<a href="/" data-slot="site_title">Axes</a>
	
	<div data-slot="chrome">
		<nav aria-label="Other versions" data-slot="axes" data-kind="chrome">
			<details data-chrome="dropdown" data-axis="serialization" aria-label="serialization" data-kind="axis">
				<summary data-slot="current">html</summary>
				<div data-slot="items">
					<a href="/tiers/html.html" data-current="true" data-kind="axis_member">
						<span data-slot="label">html</span>
					</a>
				
					<a href="/tiers/light_html.html" data-kind="axis_member">
						<span data-slot="label">light_html</span>
					</a>
				</div>
			</details>
		</nav>
		
		<span data-slot="scheme">
			<button data-chrome="button" type="button" onclick="(function(b){try{var o=['auto','light','dark'],h=document.documentElement,c=localStorage.getItem('grackle:scheme')||'auto',n=o[(o.indexOf(c)+1)%3];n=='auto'?localStorage.removeItem('grackle:scheme'):localStorage.setItem('grackle:scheme',n);var t=(h.getAttribute('data-subtheme')||'').split(' ').filter(function(x){return x&&x!='dark'&&x!='light'});if(n!='auto')t.push(n);h.setAttribute('data-subtheme',t.join(' '));b.setAttribute('aria-label',b.getAttribute('data-l-'+n))}catch(e){}})(this)" data-kind="scheme_button">
				<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor"></path><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle></svg>
			</button>
		</span>
	</div>
</header>
<main data-frame id="content" data-slot="content"><article data-kind="row" data-tree>
	<nav aria-label="Breadcrumbs" data-slot="crumbs">
		<span data-kind="crumb"><a href="/" data-slot="label">Home</a></span>
	
		<span data-kind="crumb"><a data-slot="label">Tiers</a></span>
	</nav>
	<header>
		<h1 data-slot="title">Tiers</h1>
		
	</header>
	
	
	
	
	<div data-slot="content"><h1 id="heading">Heading<a href="#heading" aria-label="Link to heading 'Heading'" data-heading-content="Heading" class="anchor"></a></h1>
<p>body</p>
</div>
	
	
</article>
</main>
</body>
</html>
