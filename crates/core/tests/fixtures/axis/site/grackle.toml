# An axis: alternative FORMS of one row (DESIGN.md q53).
#
# §4's constraint is "a row renders at exactly one route", and an axis is the
# one thing allowed to break it. Two axes here, over two different fields, to
# show that the mechanism is not a theme feature wearing a general name:
#
#   theme         /page/ and /loud/page/ — one document, two looks
#   serialization /page/ and /page/light.html — one document, two tiers
#
# Both are visible in the blessed output. What is also visible, by absence:
# neither alternate is in `sitemap.xml`, because an alternate is not a second
# document — it is what `rel="alternate"` is for, and every member's
# `rel="canonical"` names the canonical one.
extends = "none"

# Declared so the blessed output can show the point: every member's canonical
# names the CANONICAL form, not itself.
[html.head.link]
canonical = 'site.url + url'

[site]
url = "https://example.com"
title = "Axes"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[schema]
draft = { type = "bool" }
hidden = { type = "bool" }

[[collections]]
source = "."
exclude = ["themes/**"]

  # The rule that SPENDS an axis is the rule that opts its rows in (q53 step
  # 2). `look.md` lands under a theme segment; `tiers.md` under a
  # serialization one; the catch-all below spends neither, so anything else
  # publishes once.
  [[collections.rules]]
  match = "look.md"
  front_matter = true
  route = "/{theme}/look/"

  [[collections.rules]]
  match = "tiers.md"
  front_matter = true
  route = "/tiers/{serialization}.html"

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{stem}/"

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

# The first value is CANONICAL: what `rel="canonical"` names and the only one a
# `*` view sees. It wears its segment like every other member — the axis says
# WHICH forms exist, the route template says where they land.
[axes.theme]
values = ["default", "loud"]
field = "theme"

# q44's md twin, as an axis rather than a mechanism of its own: `shell` is a
# row field like `theme`, so the same machinery serializes one row two ways.
[axes.serialization]
values = ["html", "light_html"]
field = "shell"

# `*` views see canonical members only — the alternates are absent from this
# by construction, not by a filter anyone wrote.
# A VIEW materialized across an axis (q53 step 1): one declaration, one route
# per member, and the path spends the axis with a `{theme}` segment — the route
# decides where the axis lands, because that is where the rest of the URL is
# decided. Before this a gallery of N themes needed N copies of every landing.
[routes.looks]
path = "/{theme}/all/"
from = "entries"
where = "!draft && !hidden"
layout = "card"
axis = "theme"
title = "All"

[routes.sitemap]
path = "/sitemap.xml"
shell = "sitemap"

