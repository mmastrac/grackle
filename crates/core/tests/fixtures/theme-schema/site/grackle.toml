# A theme's field declarations are not this site's vocabulary.
#
# `themes/` is engine vocabulary by POSITION — the build reads
# themes from `root.join("themes")` and from nowhere else, so what sits there
# is input to the build in the same sense this file is. I7b closed the CONTENT
# walk over it. The declaration walks still descended it, which is the same
# leak `excluded-schema` records one layer down: a `.schema.toml`
# under `themes/mine/` declares `cover`, `Schemas::declared` flattens every
# rung into ONE site-wide field list, and `cover` type-checked in THIS site's
# `where` clauses — a theme and its host sharing one vocabulary.
#
# Note what this site does NOT have: an `exclude`. The rule under test is
# positional, so the fixture must not be able to pass by writing the rule the
# engine is supposed to know.
#
# So the route below is a typo now, and the load says so. Delete the `themes`
# prune in `store::walker_declarations` and `cover` becomes known again — this
# fixture renders instead of failing.
#
# `themes/.schema.toml` is not valid TOML, and it is the R2 boundary: the
# prune is asked at `themes` ITSELF, so a file sitting directly inside goes
# with the subtree. Ask the question one level down instead — at `themes/mine`,
# which is where a theme's own declaration "obviously" lives — and this file is
# read and the load fails on a TOML parse error instead of the expected
# `unknown field cover`. Both halves, one expected error: the message proves
# `cover` did not leak, and its being that message rather than a parse error
# proves nothing under `themes/` was read at all.
extends = "none"

[site]
url = "https://example.com"
title = "Themed"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[[collections]]
name = "entries"
source = "."

  [[collections.rules]]
  match = { pattern = "**/*.md", front_matter = true }
  route = "/{dir}/{stem}/"

# No `from`: a fold shell reads every output, which is what puts
# this `where` in the ROUTE vocabulary — the environment `cover` used to leak
# into.
[views.covered]
path = "/covered.xml"
shell = "sitemap"
where = 'cover != ""'
