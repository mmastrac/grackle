# Two marker files in one directory, both claiming `draft`.
#
# `blog/` holds a `.draft` and a `.published`. The config says one means
# `draft = true` and the other `draft = false`; nothing says which of the two
# governs the directory. `defaults_for` walks *directory levels*, and
# nearest-wins ranks levels — it has nothing to say about two files sitting at
# one level, so the winner used to be whichever the (unsorted) tree walk
# reached last.
#
# Delete the `bail!` in `Markers::fold` and this site loads again, with
# `blog/post.md` published or drafted by directory-iteration order.
extends = "none"

[site]
url = "https://example.com"
title = "Two Markers"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[schema]
draft = { type = "bool" }

[markers]
".draft" = { draft = true }
".published" = { draft = false }

[[collections]]
name = "entries"
source = "."

  [[collections.rules]]
  match = { pattern = "**/*.md", front_matter = true }
  route = "/{dir}/{stem}/"
