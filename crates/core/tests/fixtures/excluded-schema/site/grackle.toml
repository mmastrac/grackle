# An embedded site's field declarations are not this site's vocabulary.
#
# `embedded/` is excluded (§4c) exactly the way grack.com excludes
# `grackle/**` — a whole other site checked out inside this one. Its
# `.schema.toml` declares `cover`, and the `.schema.toml`/`.section` walk used
# to scan the root without consulting `exclude`, so `cover` type-checked in
# THIS site's `where` clauses: two unrelated sites sharing one vocabulary at
# one rung.
#
# So the route below is a typo now, and the load says so. Delete the walk's
# exclude consultation and `cover` becomes known again — this fixture renders
# instead of failing.
#
# `embedded/broken/.schema.toml` is not valid TOML. It is here for the other
# half: a walk that reads it fails the load outright, which is why a broken
# declaration committed anywhere in a repo used to be unsafe. Under an excluded directory it is now inert.
#
# `embedded/.schema.toml` — same broken half, one level up — is the boundary
# itself: `embedded/**` matches this directory's contents but not the
# directory, so pruning on `keeps` alone let the walk take exactly one step in
# and read it. Delete the `keeps_dir` question in
# `store::walker_declarations` and this fixture fails on a TOML parse error
# instead of the expected `unknown field cover`.
extends = "none"

[site]
url = "https://example.com"
title = "Excluded"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[[collections]]
name = "entries"
source = "."

  [[collections.rules]]
  match = { pattern = "**/*.md", front_matter = true }
  route = "/{dir}/{stem}/"

# No `from`: a fold shell reads every output, which is what
# puts this `where` in the ROUTE vocabulary — the environment `cover` used to
# leak into.
[views.covered]
path = "/covered.xml"
shell = "sitemap"
where = 'cover != ""'

[files]
exclude = ["embedded/**"]
