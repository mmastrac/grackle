# Crumbs: what the URL climb finds, and what a declared `trail` adds.
#
# This replaces two `trails.rs` tests that built `Route` values by hand,
# including `root.key = Some("page 1")` with the comment "what pagination
# stamps" — faking the very thing under test. Here the pagination is real.
#
# Two posts collections, and only one declares a trail, so both halves of the
# chain are visible in one blessed tree:
#
#   /blog/…   Home > Blog > 2022 > 16
#   /notes/…  Home > 2022 > 2
#
# Reading that: **Blog** is the URL CLIMB — `/blog/…` nests under the
# paginated landing, and the note at `/notes/…` does not, so only one of them
# gets it. **2022** is the grouped archive, which the climb steps past (it is
# a group route, not a landing) and the trail supplies. The last crumb is the
# day, inert because no daily archive exists to link — the same shape
# grack.com renders (`Home > Blog > 2026 > June > 25`).
#
# The note keeps a year crumb despite its collection declaring no `trail`,
# because the archive's set names both collections and therefore claims it too.
# That is engine behaviour this fixture PINS rather than endorses.
#
# It used to name only `posts` and still see the notes, because `from` a
# collection quietly meant every collection of that KIND. `from` scopes to what
# it names now (§5c), so the union that was implicit is written out — and this
# fixture is what caught the change: naming one collection dropped `_drafts`
# from every listing, which is precisely the silent failure the union spelling
# exists to prevent.
extends = "none"

[site]
url = "https://example.com"
title = "Crumbs"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[schema]
date = { type = "date" }

[[collections]]
name = "drafts"
source = "_drafts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/notes/{slug}/"

[[collections]]
name = "posts"
source = "_posts"
file = ["{date.year}-{date.month}-{date.day}-{slug}"]
trail = "yearly_archive"

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{year}/{month:02}/{day:02}/{slug}/"

[views.published]
from = ["posts", "drafts"]
order_by = "-date"

# Paginated, so the climb has a landing with a page stamp to find.
[views.blog_index]
paths = ["/blog/", "/blog/page/{n}/"]
from = "published"
paginate = 5
layout = "card"
title = "Blog"

[views.yearly_archive]
path = "/blog/{year}/"
from = "published"
group_by = "date.year"
layout = "card"
title = "{year}"

# A titleless listing: no `title`, so the heading resolves to "" through the
# i18n string layer and the <h1> collapses (§4d). The config key `uncharted`
# must NOT surface as a heading — the failure this pins.
[views.uncharted]
path = "/uncharted/"
from = "published"
limit = 5
layout = "card"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
