# A rule default for a declared bool is type-checked. `toc` is
# declared `bool` — by `base.toml`'s `[schema]`, like `draft` beside it — so
# `toc = "true"` names a type nothing can read.
#
# Before C1 the cascade keys SKIPPED `schema::apply_defaults` and were read
# back out of raw TOML: `as_bool()` on the string `"true"` is `None`, so this
# site built, and every note under `notes/` rendered with no outline and
# nothing said. Restore an exemption in `apply_defaults` and this fixture
# builds again — which is the whole item.
extends = "none"

[site]
url = "https://example.com"
title = "Mistyped Default"
author = "Tester"

# Declared fields as `base.toml` ships them (minus unused cascade keys).
# `extends = "none"` here so the site's whole vocabulary is on the page; a site
# that inherits the base gets these lines and the same error.

[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[schema]
theme = { type = "string" }
shell = { type = "string" }
toc = { type = "bool" }

[[collections]]
source = "."

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{dir}/{stem}/"
  defaults = { toc = "true" }
