# A rule default for a declared bool is type-checked (MERGE.md C1). `toc` is
# declared `bool` — by `base.toml`'s `[schema]`, like `draft` beside it — so
# `toc = "true"` names a type nothing can read.
#
# Before C1 the cascade keys SKIPPED `schema::apply_defaults` and were read
# back out of raw TOML: `as_bool()` on the string `"true"` is `None`, so this
# site built, and every note under `notes/` rendered with no outline and
# nothing said. Restore an exemption in `apply_defaults` and this fixture
# builds again — which is the whole item.
extends = "none"

[site]
url = "https://example.com"
title = "Mistyped Default"
author = "Tester"

# Declared fields as `base.toml` ships them (minus unused cascade keys).
# `extends = "none"` here so the site's whole vocabulary is on the page; a site
# that inherits the base gets these lines and the same error.
[schema]
theme = { type = "string" }
shell = { type = "string" }
toc = { type = "bool" }

[[collections]]
source = "."

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{dir}/{stem}/"
  defaults = { toc = "true" }
