# The locale axis, as a LINK selector (§6f/q53). `index.md` and `index.fr.md`
# are two rows sharing one logical identity; `?locale=` picks between them the
# same way `?theme=` picks a restyle, but resolved through by_logical since the
# member is a different file. The filename suffix gives the implicit value, the
# selector overrides it — so `index.md?locale=fr` and `index.fr.md` name one
# member, and `index.fr.md?locale=en` names the base.
extends = "none"

[site]
url = "https://example.com"
title = "Locale links"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"
[links]
policy = "strict"


[schema]
locale = { type = "string" }

[html.head.link]
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }

[html.html.attribute]
lang = 'locale'

[axes.locale]
values = ["en", "fr"]
field = "locale"

[[collections]]
name = "entries"
source = "."
file = ["{stem}.{axis:locale}", "{stem}"]

  [[collections.rules]]
  match = { pattern = "**/*.md", front_matter = true }
  route = ["/{axis:locale}/{dir}/{stem}/", "/{dir}/{stem}/"]

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
