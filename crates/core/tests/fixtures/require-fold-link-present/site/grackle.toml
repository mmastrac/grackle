# The satisfied half of `require = true`: the base declares `[routes.feed]`
# with the atom shell, so the required pool is non-empty and the build
# proceeds — the guard refuses only genuine absence.
[site]
url = "https://example.com"
title = "A Fixture"
author = "Tester"

[html.head.link]
feed = { from = "shell.atom", require = true, rel = '"alternate"', type = '"application/atom+xml"', title = 'site.title', href = 'site.url + url' }
