# A field declaration says one thing — its type. `default`, `required` and
# `label` all read like they belong beside it, and all of them were read as
# part of the table and thrown away, leaving a declaration that looked richer
# than the engine ever treated it.
#
# Declared here rather than in a `.schema.toml` beside the rows, which is the
# case this is really about: when this fixture was written the `.schema.toml`
# walk was root-wide, so a deliberately-broken declaration anywhere in this
# repo failed grack.com's own load. R1 closed that — see the `excluded-schema`
# fixture, whose broken declaration is committed and inert. Same table, same
# `parse_fields`; schema.rs's unit test covers the positional file.
extends = "none"

[site]
url = "https://example.com"
title = "Strict declarations"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[schema]
summary = { type = "string", default = "" }

[[collections]]
source = "."

  [[collections.rules]]
  match = "**/*"
  front_matter = true
  route = "/{path}"
