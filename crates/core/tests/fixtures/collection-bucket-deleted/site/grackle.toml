# `bucket` named the directory §6a's bubble-and-bucket bare-name resolution
# would have scanned. The resolution was never built and is PARKED (DESIGN.md
# §6a, MERGE.md F1 / §7 q1), so the key that configured nothing is gone and
# `deny_unknown_fields` says so at the line that wrote it — three sites in this
# repo carried it, and anyone copying one of those configs meets this error
# rather than a key that silently does nothing.
#
# The reintroduction trigger is page bundles (§5b); until then a reference is
# a path.
extends = "none"

[site]
url = "https://example.com"
title = "No buckets"
author = "Tester"


[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"

short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"
[[collections]]
name = "objects"
bucket = "assets"

  [[collections.rules]]
  match = "**/*.{png,jpg,jpeg}"
  route = "/{path}"
