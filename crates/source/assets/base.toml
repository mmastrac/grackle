# The base config — compiled into the binary.
#
# Every `grackle.toml` inherits this unless it says `extends = "none"`.
#
# Two rules govern what may live here.
#
#   1. It must be what a site would otherwise have to re-derive. If a site
#      would have to UNDO it, it belongs in the site's own file. (The base
#      theme's re-derive/undo test, same words.)
#   2. It may not mint a URL the author did not ask for, unless the absence of
#      that URL would be a bug on any site. `/atom.xml` and `/sitemap.xml`
#      qualify. Tag pages do not — plenty of sites never tag. `/search.*` does
#      not — it is a real payload.

[site]
# Placeholders.
url = "http://localhost:8080"
title = "A grackle site"
author = ""

# Global schema for all rows.
[schema]
draft = { type = "bool" }
hidden = { type = "bool" }
noindex = { type = "bool" }
toc = { type = "bool" }
tags = { type = "list" }
# Optional blurb for meta / previews.
description = { type = "string" }
# Content date (`YYYY-MM-DD`).
date = { type = "date" }
# Optional hero sources.
cover = { type = "image" }
image = { type = "image" }
# Optional locale.
locale = { type = "string" }

# Fields the engine still reads off a row BY NAME.
theme = { type = "string" }
shell = { type = "string" }
slot = { type = "string" }
# ★ Engine-read: routed, but in no query — no pool, fold, or backlink index.
queryable = { type = "bool" }

# Computed columns.
[schema.fields]
hero = 'cover ? cover : image ? image : images(content)[0]'
outline = 'toc ? outline(content, 3) : outline(content, 0)'
# ★ `hidden` is the authored word; `queryable` is what the engine reads.
queryable = '!hidden'

[schema.embeddings]
string = "title: {title} tags: {tags} body: {body}"

[schema.search]
index = ["title", "tags", "body"]
store = ["title", "date"]

# What the engine puts in the head. Text expressions over the row/listing route.
# Expansions use "from", one per member of the pool.

# Attributes on <html>
[html.html.attribute]
lang = 'locale'

# Attributes on <body>
[html.body.attribute]
# (nothing)

# <meta name="K" content="V">
[html.head.meta]
description = 'description'
author = 'site.author'
viewport = '"width=device-width, initial-scale=1"'
robots = 'noindex ? "noindex,follow" : ""'

# <meta property="K" content="V">
[html.head.property]
"og:title" = 'title'
"og:description" = 'description'
"og:url" = 'site.url + url'
# A row with a date is an article. The fact drives the value; nothing branches.
"og:type" = 'date ? "article" : "website"'
# `date` is ISO-8601 already, so the Atom-shaped timestamp is a concatenation
# rather than a function. Empty on an undated row, which emits no tag.
"article:published_time" = 'date ? date + "T00:00:00+00:00" : ""'
"article:author" = 'date ? site.author : ""'

# <link rel="K" href="V">
[html.head.link]
canonical = 'site.url + url'
# Drop a `favicon.{svg,png,ico,webp,gif}` at the site root and it gets linked.
icon = 'site.icon'
# Legacy rel="shortcut icon"
"shortcut icon" = 'site.icon'
# Locale twins as hreflang alternates (self included per spec).
# TODO: If only one locale, don't emit this.
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }
# Feed discoverability: all atom routes.
feed = { where = "shell == 'atom'", rel = '"alternate"', type = '"application/atom+xml"', title = 'site.title', href = 'site.url + url' }

# Schema.org BlogPosting for dated rows.
# <script type="application/ld+json">
[html.head.jsonld]
"@context" = '"https://schema.org"'
"@type" = 'date ? "BlogPosting" : ""'
headline = 'title'
url = 'site.url + url'
datePublished = 'date ? date + "T00:00:00+00:00" : ""'
dateModified = 'date ? date + "T00:00:00+00:00" : ""'
description = 'description'

[html.head.jsonld.mainEntityOfPage]
"@type" = '"WebPage"'
"@id" = 'site.url + url'

[html.head.jsonld.author]
"@type" = '"Person"'
name = 'site.author'
url = 'site.url + "/"'

[html.head.jsonld.publisher]
"@type" = '"Person"'
name = 'site.author'

[media_types]
md = "text/markdown"
xml = "application/xml"
json = "application/json"
txt = "text/plain"
svg = "image/svg+xml"
png = "image/png"
jpg = "image/jpeg"
jpeg = "image/jpeg"
gif = "image/gif"
webp = "image/webp"
ico = "image/x-icon"
pdf = "application/pdf"
js = "text/javascript"
mjs = "text/javascript"
cjs = "text/javascript"
woff2 = "font/woff2"
woff = "font/woff"
ttf = "font/ttf"
zip = "application/zip"
wasm = "application/wasm"
bin = "application/octet-stream"
mp4 = "video/mp4"
avif = "image/avif"

# Monolingual locale.
[axes.locale]
values = ["en"]
field = "locale"

# i18n strings follow the locale axis.
[i18n]
axis = "locale"

# Display vocabulary.
[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"
tagged = "Tagged “{key}”"

# Search overlay.
search = "Search"
search_placeholder = "Search posts…"
search_empty = "No posts match."

# Chrome parts: the feed link, the scheme control, and
# the skip link.
feed = "Feed"
scheme_auto = "Colors: auto"
scheme_light = "Colors: light"
scheme_dark = "Colors: dark"
skip = "Skip to content"

# Date display templates.
short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

# Indexed tables: decimal string keys → LocalizedStr. Taken whole on merge —
# a site that overrides `months` restates the table. Titles/crumbs look up
# entries with `@months[{month}]` (§6f).
[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"

# Marker files: if present, set the corresponding flag.
[markers]
".draft" = { draft = true }
".hidden" = { hidden = true }
".noindex" = { noindex = true }


# Posts: dated posts, rendered in a /blog/ URL space.
[[collections]]
name = "posts"
source = "_posts"
# The extractor's default for this collection's rules (§4): a rule
# may name its own `file`, and a rule routing by path tokens alone
# (`/{dir}/{stem}/`) needs none at all.
file = ["{date.year}-{date.month}-{date.day}-{slug}"]
# Posts are a timeline
order_by = "-date"

  # For --profile drafts, we want to show the draft posts at /blog/drafts/{slug}/ (drafts don't
  # always have a date to publish to)
  # For --profile dev, we want to show the draft posts in the timeline.
  # Otherwise, they are not published.
  [[collections.rules]]
  match = { draft = true }
  only = "drafts"
  route = "/blog/drafts/{slug}/"
  defaults = { queryable = false }

  [[collections.rules]]
  match = { draft = true }
  unless = ["dev", "drafts"]
  publish = false

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{year}/{month:02}/{day:02}/{slug}/"
  defaults = { shell = "html" }

  # Neighbour lists.
  [collections.relations.earlier]
  where = "candidate.date.year * 10000 + candidate.date.month * 100 + candidate.date.day < self.date.year * 10000 + self.date.month * 100 + self.date.day"
  rank = "candidate.date.year * 10000 + candidate.date.month * 100 + candidate.date.day"
  limit = 1

  [collections.relations.later]
  where = "candidate.date.year * 10000 + candidate.date.month * 100 + candidate.date.day > self.date.year * 10000 + self.date.month * 100 + self.date.day"
  rank = "-(candidate.date.year * 10000 + candidate.date.month * 100 + candidate.date.day)"
  limit = 1

  [collections.relations.related]
  where = "!(candidate in earlier) && !(candidate in later) && !(candidate in links_to)"
  rank = "embedding_similarity(self, candidate)"
  limit = 4

  [collections.relations.linked_from]
  from = "linked_from"
  where = "!(candidate in ancestors)"

# Images
[[collections]]
name = "images"

  # The one image the base routes
  [[collections.rules]]
  match = "favicon.{svg,png,webp,gif,ico}"
  route = "/{path}"
  defaults = { shell = "raw" }

  # Images don't have a route - they'll get a content-addressed URL by default.
  # Note that an embed-only rule is weaker than a routed rule.
  [[collections.rules]]
  match = "**/*.{png,jpg,jpeg,gif,webp,svg}"
  embed = true
  defaults = { shell = "raw" }

[files]
exclude = [
  "**/node_modules",
  "**/vendor",
  "_cache/**",
  "@.gitignore",
]

# Pages: generally undated posts, rendered in their tree position.
[[collections]]
name = "pages"
source = "."

  # For --profile drafts or --profile dev, we want to show the draft pages in-place
  # In --profile drafts they are unqueryable and only appear at their real URLs (they do not
  # appear in sitemap/feeds/search/etc.)
  [[collections.rules]]
  match = { draft = true }
  unless = ["dev", "drafts"]
  publish = false

  [[collections.rules]]
  partial = true
  match = { draft = true }
  only = "drafts"
  defaults = { queryable = false, noindex = true }

  [[collections.rules]]
  match = "**/index.{html,md}"
  route = "/{dir}/"

  [[collections.rules]]
  match = { pattern = "**/*.{html,md}", front_matter = true }
  route = "/{dir}/{stem}/"
  defaults = { shell = "html" }

  # A document file without identity ships as bytes.
  [[collections.rules]]
  partial = true
  match = "**/*.{html,md}"
  defaults = { shell = "raw" }

  [collections.relations.linked_from]
  from = "linked_from"
  where = "!(candidate in ancestors)"

# Define a home view by default. If `index.md` or `index.html` exists, that becomes
# the content. If not, the content is purely generated from the standard theme template.
[views.home]
path = "/"
from = "posts"
limit = 10
layout = "card"
default_content = "index.{md,html}"
title = "@home"

# The paginated blog index.
[views.blog_index]
paths = ["/blog/", "/blog/page/{n}/"]
from = "posts"
paginate = 10
layout = "card"
title = "@blog"

# Tag index. If no tags are present, no tag views are generated.
[views.tag_index]
path = "/blog/tags/{key}/" # to get untagged posts: ["/blog/untagged/", "/blog/tags/{key}/"]
from = "posts"
group_by = "tags"
layout = "card"
noindex = true
title = "@tagged"
crumb = "{key}"

[views.feed]
path = "/atom.xml"
from = "posts"
limit = 20
shell = "atom"

# Reads every published route.
[views.sitemap]
path = "/sitemap.xml"
shell = "sitemap"
where = 'media_type == "text/html"'

# Publishes draft posts at /drafts/{slug}/, draft pages in-place.
[profiles.drafts]
description = "Publish draft posts and pages as unlisted URLs on a live site"

# Adds noindex to all pages
[profiles.staging]
description = "Mark the site as staging making it unlisted from search engines"

  [profiles.staging.force]
  noindex = true
