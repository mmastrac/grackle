# The base config — compiled into the binary (DESIGN.md §4d).
#
# Every `grackle.toml` inherits this unless it says `extends = "none"`.
# A site can forget to copy a file; it cannot forget the binary. This is the
# base THEME's argument (themes/DESIGN.md) applied one layer down, and it uses
# no new mechanism: a site's collection rules PREPEND to the ones below, and
# §4's "first writer wins, per key" does the rest.
#
# Two rules govern what may live here.
#
#   1. It must be what a site would otherwise have to re-derive. If a site
#      would have to UNDO it, it belongs in the site's own file. (The base
#      theme's re-derive/undo test, same words.)
#   2. It may not mint a URL the author did not ask for, unless the absence of
#      that URL would be a bug on any site. `/atom.xml` and `/sitemap.xml`
#      qualify. Tag pages do not — plenty of sites never tag. `/search.*` does
#      not — it is a real payload.
#
# `examples/raw` is this file spelled out under `extends = "none"`, and a test
# holds the two to the same URL set — so the printed version cannot drift from
# the compiled one.

[site]
# Placeholders. A real site overrides all three; they exist so that an EMPTY
# grackle.toml is a valid one, which is what `examples/minimal` measures.
url = "http://localhost:8080"
title = "A grackle site"
author = ""

# The flag family (§4e). Ordinary declared bool fields — the engine's row
# type names none of them, and `extends = "none"` genuinely leaves a site
# without them, at which point `where = "!draft"` is a load error naming the
# knowns rather than a filter that quietly matches everything.
#
# They live in `[schema]` rather than on a collection because they are
# properties of a ROW, not of a directory or a source: a page can be hidden
# exactly as a post can. `toc` opts a document into its heading outline (§6e).
[schema]
draft = { type = "bool" }
hidden = { type = "bool" }
noindex = { type = "bool" }
toc = { type = "bool" }
# Declared so front matter uses the ordinary list path (sequence or
# whitespace-separated string). Base mints no tag routes.
tags = { type = "list" }
# Optional blurb for meta / previews. Ordinary string, not an engine column.
description = { type = "string" }
# Content date (`YYYY-MM-DD`). Ordinary declared field; engine type `date`
# validates the form. Filled from front matter or `{date.year|month|day}` in a
# collection's `file` pattern.
date = { type = "date" }

# Fields the engine still reads off a row BY NAME — which theme renders it
# (§5a), which shell wraps it (§5g), which slot cuts the render chain, and
# which locale the row is (§6f). Declared here so a marker or a rule setting
# one goes through `schema::apply_defaults` like every other key (MERGE.md C1).
# Their types are the engine's: restating a line below is fine; declaring one
# at another type is a load error. A site that declines the base declares
# whatever its rows and rules actually use.
theme = { type = "string" }
shell = { type = "string" }
slot = { type = "string" }
# Stamped at load when `[axes.*]` declares the pairing axis (default when no
# file pattern matched). Shares its name with `[axes.locale] field` in the
# usual spelling; a site that renames the axis declares that field instead.
locale = { type = "string" }

[schema.embeddings]
string = "title: {title} tags: {tags} body: {body}"

[schema.search]
fields = ["title", "tags", "body"]

# What the engine puts in the head, declared rather than compiled in (§4e).
#
# Each value is a §5f text expression over the row — or, for a listing, over
# its route — plus `site.url` / `site.title` / `site.author`. An EMPTY result
# emits no tag, which is §5e's "an empty part deletes its element" one layer
# up, and is how every conditional here is spelled.
#
# A value may also be an *expand*: `{ from = "…", attr = 'expr', … }` emits
# one tag per member of a candidate pool (`from` is the same word a relation
# spells). That is how a variable-length list — `rel="alternate" hreflang` ×
# n — folds into the same tables (§4e residue).
#
# Three tables because there are three head elements, not three mechanisms:
#   [html.head.meta]      <meta name="K" content="V">
#   [html.head.property]  <meta property="K" content="V">   (Open Graph)
#   [html.head.link]      <link rel="K" href="V">
# Plus a structured document, not a content attribute:
#   [html.head.jsonld]    <script type="application/ld+json">
# Plus attribute maps on the skeleton (§4e):
#   [html.html.attribute] <html K="V">
#   [html.body.attribute] <body K="V">
#
# Extension → media type lives at the top level (`[media_types]`), not under
# `[html]`: it is URL vocabulary, not head-tag vocabulary.
#
# `noindex ? …` is CEL's own conditional, which is why it is spelled with `?`
# rather than an `if_else()` the engine would have to register. §5d's
# no-control-flow rule governs TEMPLATES; this is the expression surface, and
# "which string does this meta take" has no fact-shaped spelling.

# Attributes on the skeleton elements (§4e): same expression surface as the
# head tables. Empty omits. `lang` is the document language — the pairing-
# axis field in the usual spelling; a site that renames the axis restates
# the expression (`lang = 'lang'`).
[html.html.attribute]
lang = 'locale'

# [html.body.attribute] is available for `<body …>` stamps; the base leaves
# the body bare.

[html.head.meta]
description = 'description'
author = 'site.author'
viewport = '"width=device-width, initial-scale=1"'
robots = 'noindex ? "noindex,follow" : ""'

[html.head.property]
"og:title" = 'title'
"og:description" = 'description'
"og:url" = 'site.url + url'
# A row with a date is an article. The fact drives the value; nothing branches.
"og:type" = 'date ? "article" : "website"'
# `date` is ISO-8601 already, so the Atom-shaped timestamp is a concatenation
# rather than a function. Empty on an undated row, which emits no tag.
"article:published_time" = 'date ? date + "T00:00:00+00:00" : ""'
"article:author" = 'date ? site.author : ""'

[html.head.link]
canonical = 'site.url + url'
# Drop a `favicon.{svg,png,ico,webp,gif}` at the site root and it is linked.
# `site.icon` is the first of those URLs the tree fills, so an icon that lives
# elsewhere is pinned by an ordinary named object route (§4) rather than by a
# key here. No file ⇒ empty ⇒ no tag, which is why this is safe to inherit.
icon = 'site.icon'
# The legacy spelling, and the reason it is a LINE rather than engine code:
# `rel="shortcut icon"` is what browsers old enough to want it will read, the
# duplicate href is the whole point, and a site that has stopped caring
# deletes this line. Declaring it costs nothing on a site with no icon.
"shortcut icon" = 'site.icon'
# Locale twins as hreflang alternates (self included, as the spec asks).
# `from = "axis.<name>"` expands over any declared axis's include-self pool;
# a monolingual page yields one member and emits nothing.
alternate = { from = "axis.locale", hreflang = 'locale', href = 'site.url + url' }

# Schema.org BlogPosting for dated rows. Nested tables are JSON objects;
# string leaves are the same CEL surface as the meta tables. Empty `@type`
# (no date) ⇒ no script.
[html.head.jsonld]
"@context" = '"https://schema.org"'
"@type" = 'date ? "BlogPosting" : ""'
headline = 'title'
url = 'site.url + url'
datePublished = 'date ? date + "T00:00:00+00:00" : ""'
dateModified = 'date ? date + "T00:00:00+00:00" : ""'
description = 'description'

[html.head.jsonld.mainEntityOfPage]
"@type" = '"WebPage"'
"@id" = 'site.url + url'

[html.head.jsonld.author]
"@type" = '"Person"'
name = 'site.author'
url = 'site.url + "/"'

[html.head.jsonld.publisher]
"@type" = '"Person"'
name = 'site.author'

[media_types]
md = "text/markdown"
xml = "application/xml"
json = "application/json"
txt = "text/plain"
svg = "image/svg+xml"
png = "image/png"
jpg = "image/jpeg"
jpeg = "image/jpeg"
gif = "image/gif"
webp = "image/webp"
ico = "image/x-icon"
pdf = "application/pdf"
js = "text/javascript"
mjs = "text/javascript"
cjs = "text/javascript"
woff2 = "font/woff2"
woff = "font/woff"
ttf = "font/ttf"
zip = "application/zip"
wasm = "application/wasm"
bin = "application/octet-stream"
mp4 = "video/mp4"
avif = "image/avif"

# Monolingual pairing axis. Sites that want translations redeclare with a
# fuller `values` list; `[i18n] axis` points here until a site renames it.
[axes.locale]
values = ["en"]
field = "locale"

# Which declared axis drives pairing, the switcher, and single-locale indexes.
# Sites that rename the axis (`[axes.lang]`) set this to match.
[i18n]
axis = "locale"

# Display vocabulary the engine looks up by name (§6f). Override per key or
# per pairing-axis member; a site with `extends = "none"` that still wants
# these strings declares them itself.
[i18n.strings]
home = "Home"
blog = "Blog"
drafts = "Drafts"
related = "Related"
later = "Later post"
earlier = "Earlier post"
linked_from = "Linked from"
translations = "Translations"
page = "Page {n}"
# Date display templates (§6f): looked up by name (`medium_date`, …), then
# expanded with `{year}`/`{month}`/`{day}` and `@months[…]` / `@months_short[…]`.
short_date = "{day} @months_short[{month}] {year}"
medium_date = "{day} @months[{month}] {year}"
long_date = "@months[{month}] {day}, {year}"

# Indexed tables: decimal string keys → LocalizedStr. Taken whole on merge —
# a site that overrides `months` restates the table. Titles/crumbs look up
# entries with `@months[{month}]` (§6f).
[i18n.tables.months]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[i18n.tables.months_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"

# §4b: the config says what a marker means, the tree says where. These three
# names were conventions every site restated; nothing was built in before.
[markers]
".draft" = { draft = true }
".hidden" = { hidden = true }
".noindex" = { noindex = true }

# ---------------------------------------------------------------- posts
#
# A missing `_posts/` is not an error — the collection contributes no rows and
# the views over it come out empty, so a site with no blog pays nothing for
# this entry.
#
# The rule's glob names the EXTENSIONS this scope claims, which is I7a's move
# one scope over (IO.md I7d): the posts loader's own walk took `["md",
# "markdown"]` as an argument, and now the one rule that says where a post
# lands is also what says a post is markdown. It matters because **a scope owns
# its source**: what no rule of this scope claims is not content at all, so an
# image beside a draft stays invisible rather than falling through to the tree.

[[collections]]
source = "_posts"
# The extractor's default for this collection's rules (§4, IO.md I6): a rule
# may name its own `file`, and a rule routing by path tokens alone
# (`/{dir}/{stem}/`) needs none at all.
file = ["{date.year}-{date.month}-{date.day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{year}/{month:02}/{day:02}/{slug}/"
  defaults = { shell = "html" }

# ---------------------------------------------------------------- objects
#
# Images only. Every other extension stays a tree row and ships verbatim at its
# own path, which is the same bytes at the same URL — the difference an objects
# collection makes is the `by_name` index (§6a, parked) and header-read
# dimensions, and neither means anything for a `.zip`.
#
# The extension list IS the rule's glob (IO.md I7a): membership in this scope
# is what its rules claim, in the one mechanism that also says where a claimed
# row lands. Globs compile case-insensitively, so `.PNG` is a `png`.
#
# The shell is declared here like every other rule's (IO.md §4, "defaults are
# declared, not built in"). It reached nobody until I7e — an object row was
# built from `Default::default()`, so no cascade ran over it and its `shell`
# was Null — and now that there is one row constructor it is the line that says
# an image leaves through the transparent shell, which is what it always did.
#
# `embed = true` and NOT `route = "/{path}"` (IO.md §4a, I11), which is rule 2
# above at its strictest: the base used to mint a public URL for every image on
# every site that inherited it, at a path the author never wrote down and could
# not have declined without an `extends = "none"`. Now it mints none. An
# `<img>` reaches these rows at their content address under `/static/`, an
# authored link to one is a load error naming the fix, and an image nothing
# cites ships nowhere at all.
#
# A site that wants literal asset paths writes ONE rule saying so, above this
# one — `route = "/{path}"`, which is the line that used to be here — and every
# corpus site with images already does (`examples/field-notes`, `examples/theme-preview`
# and grack.com each declare their own objects rule; that is why this change
# moves no byte anywhere). First-writer-wins does the rest: the address
# question is answered once, by the first rule that answers it either way, so
# a site's route silences this line without deleting it.

[[collections]]
name = "objects"

  # The one image the base routes, and it is rule 2's own exception: a site
  # icon is fetched by URL with nothing on the page pointing at it in any way
  # a reference scan can see, so it cannot be reference-driven — and
  # `[html.head.link] icon` above LINKS `site.icon`, which is the first of
  # `/favicon.{svg,png,ico,webp,gif}` a row occupies (§4d, build.rs's
  # `ICON_URLS`). Leave this to the embed policy and every base-inheriting site
  # ships a `<link rel="icon">` pointing at nothing, which is a bug on any
  # site.
  #
  # The four extensions are the intersection of that list with the glob below:
  # `.ico` is not an image this scope claims, so it stays an ordinary tree byte
  # copy at its literal path, exactly as it did before this rule existed.
  [[collections.rules]]
  match = "favicon.{svg,png,webp,gif}"
  route = "/{path}"
  defaults = { shell = "raw" }

  [[collections.rules]]
  match = "**/*.{png,jpg,jpeg,gif,webp,svg}"
  embed = true
  defaults = { shell = "raw" }

# ---------------------------------------------------------------- pages
#
# Front matter is what the rules below select on: with it, a page at a pretty
# URL; without it, bytes at the literal path, invisible to every query.
#
# It is a fact and not a branch, though — whether a row is a DOCUMENT is
# `front_mattered || shell ∈ {html, light_html}` (IO.md I7c), so the second
# clause is what these rules spend. Point a rule with no front-matter gate at a
# blockless file, default it `shell = "html"`, and it renders as a degenerate
# row: a warning, a title implied from its slug, and a page. Nothing here does
# that; the base routes identity-less files `raw`, which is the normal case.
#
# Front matter also decides the SHELL, and the two rules below say so rather than leaving
# it to a fallback in the renderer (IO.md §4, I2: "defaults are declared, not
# built in"). A rule's defaults apply wherever the rule MATCHES, not only where
# it wins the route — so the index rule needs no shell of its own: a
# front-mattered `index.md` takes `html` from the second rule and a static
# `index.html` takes `raw` from the third, each by the same front-matter gate
# that decides everything else about it. That is also why the index rule may
# not simply declare `html`: half the files it routes are byte copies.

[[collections]]
source = "."

  [[collections.rules]]
  match = "**/index.{html,md}"
  route = "/{dir}/"

  [[collections.rules]]
  match = "**/*.{html,md}"
  front_matter = true
  route = "/{dir}/{stem}/"
  defaults = { shell = "html" }

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"
  defaults = { shell = "raw" }

# ------------------------------------------------------------------ sets

# The published set, named once so that every consumer below cannot drift apart
# about what "a post list" means. This is the entry a site overrides most often
# and the reason `[sets]` exists at all.
[sets.published]
from = "posts"
where = "!draft && !hidden"
order_by = "-date"

# ---------------------------------------------------------------- routes

# `/` is the one URL every site has an opinion about, so the base does not
# decide it — it offers both answers and lets the tree pick. With an
# `index.md`, that row claims the route and owns the page (§5h mode B, and it
# can place `{% view home %}` to pull the posts back in). Without one, `/` is
# the ten newest posts. Neither outcome had to be declared by the site, and
# neither is a guess: both are written here.
[routes.home]
path = "/"
from = "published"
limit = 10
layout = "card"
default_content = "index.{md,html}"
title = "@home"

# The archive, always paginated and always complete — so a claimed `/` that
# shows prose instead of posts never makes the corpus unreachable.
[routes.blog_index]
paths = ["/blog/", "/blog/page/{n}/"]
from = "published"
paginate = 10
layout = "card"
title = "@blog"

[routes.feed]
path = "/atom.xml"
from = "published"
limit = 20
shell = "atom"

# No `from`: a FOLD shell with no pool named reads every output (IO.md §4),
# which at this stage is the route set. It ranges over ROUTES, and a routed
# row is routed whatever its flags say — hence the restated predicate. Any
# such route a site adds needs the same one (DESIGN.md §5c).
[routes.sitemap]
path = "/sitemap.xml"
shell = "sitemap"
where = '!draft && !hidden && (dir || ext == "html")'
