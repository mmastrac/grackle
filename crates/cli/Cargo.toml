[package]
name = "grackle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "grackle"
path = "src/main.rs"

[dependencies]
grackle-core = { workspace = true }
grackle-source = { workspace = true }
grackle-search-core = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
