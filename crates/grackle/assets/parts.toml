# Engine part schemas: the vocabulary every theme fragment is checked against,
# a type contract, AND the canonical reading order the null theme renders in.
#
# Order is load-bearing. `PartMap::set` stores parts at their position HERE,
# not in call order, and `canonical()` walks that — so reordering a kind here
# reorders the null-theme (and partial-theme fallback) rendering, and a
# producer cannot drift it by reordering its `set`s. A fully-themed site never
# reaches `canonical()`, so its bytes are the fragment's order, not this one;
# this is the order a theme inherits when it declines to arrange a kind.
#
# Pairs, not a table: a TOML table has no stable order, so it could not carry a
# canonical one and would make diffs unreadable between builds.

[[kind]]
name = "shell"
parts = [
  ["nav", "html"],
  ["site_title", "text"],
  ["axes", "stream:axis"],
  ["main", "html"],
  ["copyright", "html"],
]

[[kind]]
name = "document"
parts = [
  ["title", "text"],
  ["url", "url"],
  ["tree", "flag"],
  ["crumbs", "stream:crumb"],
  ["tags", "stream:tag"],
  ["hero", "map:summary"],
  ["section", "stream:outline_entry"],
  ["outline", "stream:outline_entry"],
  ["content", "html"],
  ["relations", "stream:relation"],
]

[[kind]]
name = "outline_entry"
parts = [
  ["label", "text"],
  ["url", "url"],
  ["current", "text"],
  ["children", "stream:outline_entry"],
]

[[kind]]
name = "listing"
parts = [
  ["title", "text"],
  ["crumbs", "stream:crumb"],
  ["intro", "html"],
  ["featured", "map:summary"],
  ["items", "stream:summary"],
  ["pagination", "map:pagination"],
]

# The axis slot (q47, §6f): every axis THIS page is a member of, each with its
# members — rendered in the shell chrome (a dropdown by the search icon). The
# locale axis is the language switcher; a theme axis is a "view in another look"
# switcher. Supersedes the `translations` relation — it is just the `locale`
# group here. `axis` is the theme contract, stamped `data-axis`; `current` is
# the current member's label, for the dropdown's summary.
[[kind]]
name = "axis"
parts = [
  ["axis", "text"],
  ["label", "text"],
  ["current", "text"],
  ["items", "stream:axis_member"],
]

[[kind]]
name = "axis_member"
parts = [
  ["label", "text"],
  ["url", "url"],
  ["current", "text"],
]

[[kind]]
name = "summary"
parts = [
  ["title", "text"],
  ["url", "url"],
  ["date", "text"],
  ["date_pretty", "text"],
  ["src", "url"],
  ["width", "text"],
  ["height", "text"],
  ["note", "text"],
  ["truncated", "flag"],
  ["tags", "stream:tag"],
  ["content", "html"],
]

[[kind]]
name = "link_list"
parts = [
  ["items", "stream:link"],
]

[[kind]]
name = "link"
parts = [
  ["title", "text"],
  ["url", "url"],
]

[[kind]]
name = "crumb"
parts = [
  ["label", "text"],
  ["url", "url"],
]

[[kind]]
name = "tag"
parts = [
  ["name", "text"],
  ["url", "url"],
]

[[kind]]
name = "relation"
parts = [
  # The relation's NAME — the theme contract themes key CSS on, stamped
  # `data-relation` (§6g, renamed from `data-axis` at the axis/relation split).
  ["relation", "text"],
  ["label", "text"],
  ["items", "stream:neighbor"],
]

[[kind]]
name = "neighbor"
parts = [
  ["url", "url"],
  ["date", "text"],
  ["date_pretty", "text"],
  ["title", "text"],
]

[[kind]]
name = "pagination"
parts = [
  ["prev", "url"],
  ["next", "url"],
  ["pages", "stream:page_link"],
]

[[kind]]
name = "page_link"
parts = [
  ["n", "text"],
  ["url", "url"],
  ["current", "text"],
]

# The shape a `list` field fills: one string per item, nothing else. A site
# that wants its own name (and its own data-kind for CSS) declares a kind of
# the same shape — one text part — and names it in `stream:`.
[[kind]]
name = "item"
parts = [
  ["label", "text"],
]

[[kind]]
name = "raw"
parts = [
  ["content", "html"],
]
