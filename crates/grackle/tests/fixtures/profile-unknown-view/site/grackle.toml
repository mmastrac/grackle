# A profile naming a view that does not exist (MERGE.md R5).
#
# The point of this fixture is the FLAG THAT IS NOT PASSED. The suite builds
# every site with `Config::load` — no `--profile` anywhere — and this one
# still fails, because `[profiles.staging]` is part of this config rather
# than a second one. Under C6 the placement and name checks lived inside
# `apply_profile`, so this site built happily and the typo below first spoke
# on the day someone ran `--profile staging`.
#
# `publised` is the misspelling: the base's `[sets.published]` is the query
# every listing, archive and feed reads, and relaxing it is what a drafts-
# shaped profile is for. The knowns in the error are listed by SECTION,
# because "which of sets/routes does this name live in" is half of what a
# profile has to get right.

[site]
url = "https://example.com"
title = "Profile Typo"
author = "Tester"

[[collections]]
kind = "posts"
source = "_posts"
filename_formats = ["{year}-{month}-{day}-{slug}"]

[profiles.staging]

  [profiles.staging.force]
  noindex = true

  [profiles.staging.sets.publised]
  where = "!hidden"
