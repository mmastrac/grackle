# A second `kind = "tree"` collection (MERGE.md C7a).
#
# This site declares its tree at `source = "pages"`. Collections key on
# `source` (MERGE.md §1), so that does not REPLACE the base's tree at `.` —
# it sits beside it, and the site ends up with two. Before C7a `load` took
# whichever came last in name order (`pages` beats `entries`) and the other
# collection was discarded entire: its rules, `exclude`, `include` and
# `schema` all went with it, which is how `robots.txt` below could become
# "no rule supplies a route" on a site that inherits three tree rules.
#
# The error names both entries, because "you have two" is unactionable
# unless the reader can see which two — and one of them is not in this file.

[site]
url = "https://example.com"
title = "Two Trees"
author = "Tester"

[[collections]]
kind = "tree"
source = "pages"

  [[collections.rules]]
  match = "**/*.md"
  front_matter = true
  route = "/{dir}/{stem}/"
