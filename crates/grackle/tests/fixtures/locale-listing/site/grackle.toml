# q47: a listing view renders a language switcher. A French reader on /fr/blog/
# gets a way back to /blog/ — the axis slot, computed for the view route from its
# own routes in other locales (the same mechanism a row uses through by_logical).
extends = "none"

[site]
url = "https://example.com"
title = "Locale listing"
author = "Tester"

[axes.locale]
values = ["en", "fr"]
field = "locale"

[i18n.names]
en = "English"
fr = "Français"

[[collections]]
name = "posts"
source = "_posts"
file = ["{year}-{month}-{day}-{slug}.{axis:locale}", "{year}-{month}-{day}-{slug}"]

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{slug}/"

[routes.blog]
path = "/blog/"
from = "posts"
layout = "card"
title = "Blog"
