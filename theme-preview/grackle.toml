[routes.search]
path = "/search.bin"
from = "*"
shell = "search"
where = '(kind == "post" || kind == "page") && !draft && !hidden && stem != "index"'

[routes.sitemap]
path = "/sitemap.xml"
from = "*"
shell = "sitemap"
where = '!draft && !hidden && (dir || ext == "html")'
