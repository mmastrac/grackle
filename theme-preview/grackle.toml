# The theme gallery's preview site.
#
# One server, five themes, no restart: each theme owns a URL prefix, and a
# rule default cascades `theme:` onto everything under it (§5a — theme is
# chosen per ROW). So /ledger/ and /atlas/ are the same content shapes
# rendered by different theme directories, side by side in two tabs.
#
# `themes` is a symlink to ../themes, the gallery itself, and `serve`
# watches through it — editing a token file re-renders every page here.
#
# The content tree is generated (identical subtrees are what make the
# themes comparable) and the repetition below follows from it: three
# landings per theme, each CLAIMING a content row whose theme the rules
# have already decided, because that is how a view route picks a theme.
#
# This is a harness, not an example site — for the engine's own kitchen
# sink (i18n, objects, script shells, embeddings) see examples/field-notes.

root = "."

# No base config (§4d). This harness is deliberately atypical: six posts
# collections, one per theme, and no site-level blog at all. The base's
# `published` set would sweep all six into one `/blog/` — every posts
# collection feeds the one posts table (§4), which is also why each set below
# restates `collection == "…"` rather than trusting `from` to scope it.
#
# The second live user of the escape hatch, after `examples/raw`. A site whose
# shape the base did not anticipate says so in one line instead of shadowing
# five routes.
extends = "none"

# Declining the base means declining its vocabulary too (§4e): the flag family
# is ordinary declared schema, so a site that inherits nothing declares its own
# before filtering on it.
[schema]
draft = { type = "bool" }
hidden = { type = "bool" }
noindex = { type = "bool" }

# Declining the base also declines its head (§4e). This block is the base's,
# copied — which is the honest cost of `extends = "none"` and worth seeing in
# the repo next to a site that pays nothing for the same thing.
[html.head.meta]
description = 'description'
author = 'site.author'
viewport = '"width=device-width, initial-scale=1"'
robots = 'noindex ? "noindex,follow" : ""'

[html.head.property]
"og:title" = 'title'
"og:description" = 'description'
"og:url" = 'site.url + url'
# A row with a date is an article. The fact drives the value; nothing branches.
"og:type" = 'date ? "article" : "website"'
# `date` is ISO-8601 already, so the Atom-shaped timestamp is a concatenation
# rather than a function. Empty on an undated row, which emits no tag.
"article:published_time" = 'date ? date + "T00:00:00+00:00" : ""'
"article:author" = 'date ? site.author : ""'

[html.head.link]
canonical = 'site.url + url'

[site]
url = "http://localhost:8083"
baseurl = ""
title = "Theme Gallery"
author = "grackle"

# ------------------------------------------------------------------ pages
#
# Everything is a tree row. There is deliberately no posts collection: a
# post belongs to one theme, and every row here has to belong to whichever
# theme owns its prefix.

[[collections]]
kind = "tree"
source = "."
exclude = ["themes/**"]

  # The five lines this whole site exists for.
  [[collections.rules]]
  match = "vanilla/**"
  defaults = { theme = "vanilla" }

  [[collections.rules]]
  match = "ledger/**"
  defaults = { theme = "ledger" }

  [[collections.rules]]
  match = "marginalia/**"
  defaults = { theme = "marginalia" }

  [[collections.rules]]
  match = "terminal/**"
  defaults = { theme = "terminal" }

  [[collections.rules]]
  match = "atlas/**"
  defaults = { theme = "atlas" }

  [[collections.rules]]
  match = "miroir/**"
  defaults = { theme = "miroir" }

  [[collections.rules]]
  match = "**/index.{html,md}"
  route = "/{dir}/"

  [[collections.rules]]
  match = "**/*.{html,md}"
  front_matter = true
  route = "/{dir}/{stem}/"

  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

# ------------------------------------------------------------------ notes
#
# One posts collection per theme. Posts, not tree rows, because only a
# posts-backed view carries truncated prose and pagination into a claimed
# row's embed — the tree branch passes neither.

[[collections]]
name = "vanilla_notes"
kind = "posts"
source = "vanilla/_posts"
filename_formats = ["{year}-{month}-{day}-{slug}"]

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post", theme = "vanilla" }
  route = "/vanilla/notes/{slug}/"


[[collections]]
name = "ledger_notes"
kind = "posts"
source = "ledger/_posts"
filename_formats = ["{year}-{month}-{day}-{slug}"]

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post", theme = "ledger" }
  route = "/ledger/notes/{slug}/"


[[collections]]
name = "marginalia_notes"
kind = "posts"
source = "marginalia/_posts"
filename_formats = ["{year}-{month}-{day}-{slug}"]

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post", theme = "marginalia" }
  route = "/marginalia/notes/{slug}/"


[[collections]]
name = "terminal_notes"
kind = "posts"
source = "terminal/_posts"
filename_formats = ["{year}-{month}-{day}-{slug}"]

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post", theme = "terminal" }
  route = "/terminal/notes/{slug}/"


[[collections]]
name = "atlas_notes"
kind = "posts"
source = "atlas/_posts"
filename_formats = ["{year}-{month}-{day}-{slug}"]

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post", theme = "atlas" }
  route = "/atlas/notes/{slug}/"


[[collections]]
name = "miroir_notes"
kind = "posts"
source = "miroir/_posts"
filename_formats = ["{year}-{month}-{day}-{slug}"]

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post", theme = "miroir" }
  route = "/miroir/notes/{slug}/"

# ---------------------------------------------------------------- objects

[[collections]]
name = "objects"
kind = "objects"
exclude = ["themes/**"]
extensions = ["png", "jpg", "jpeg", "gif", "webp", "svg"]
bucket = "assets"

  [[collections.rules]]
  match = "**"
  route = "/{path}"

# ---------------------------------------------------------------- widgets

[widgets]
callout = """
<callout>
<div>

{body}

</div>
</callout>
"""

# ------------------------------------------------------------------- sets

[sets.vanilla_notes_set]
from = "vanilla_notes"
where = '!draft && !hidden && collection == "vanilla_notes"'
order_by = "-date"

  [sets.vanilla_notes_set.fields.summary]
  truncate = { max_blocks = 1, max_chars = 180 }

[sets.ledger_notes_set]
from = "ledger_notes"
where = '!draft && !hidden && collection == "ledger_notes"'
order_by = "-date"

  [sets.ledger_notes_set.fields.summary]
  truncate = { max_blocks = 1, max_chars = 180 }

[sets.marginalia_notes_set]
from = "marginalia_notes"
where = '!draft && !hidden && collection == "marginalia_notes"'
order_by = "-date"

  [sets.marginalia_notes_set.fields.summary]
  truncate = { max_blocks = 1, max_chars = 180 }

[sets.terminal_notes_set]
from = "terminal_notes"
where = '!draft && !hidden && collection == "terminal_notes"'
order_by = "-date"

  [sets.terminal_notes_set.fields.summary]
  truncate = { max_blocks = 1, max_chars = 180 }

[sets.atlas_notes_set]
from = "atlas_notes"
where = '!draft && !hidden && collection == "atlas_notes"'
order_by = "-date"

  [sets.atlas_notes_set.fields.summary]
  truncate = { max_blocks = 1, max_chars = 180 }

[sets.miroir_notes_set]
from = "miroir_notes"
where = '!draft && !hidden && collection == "miroir_notes"'
order_by = "-date"

  [sets.miroir_notes_set.fields.summary]
  truncate = { max_blocks = 1, max_chars = 180 }

# The card face. Only `atlas` and `miroir` ship a `summary--card` fragment;
# the other three have none and fall back to their plain `listing`, which
# is the partiality rule (§5e) doing its job in public and worth seeing.
[sets.shelf]
from = "entries"
where = "!draft && !hidden"
match = "*/shelf/**"
order_by = "-date"

[sets.vanilla_shelf]
from = "shelf"
match = "vanilla/**"

[sets.ledger_shelf]
from = "shelf"
match = "ledger/**"

[sets.marginalia_shelf]
from = "shelf"
match = "marginalia/**"

[sets.terminal_shelf]
from = "shelf"
match = "terminal/**"

[sets.atlas_shelf]
from = "shelf"
match = "atlas/**"

[sets.miroir_shelf]
from = "shelf"
match = "miroir/**"

# ----------------------------------------------------------------- routes

# ---- the listing face, paginated two to a page

[routes.vanilla_notes_index]
paths = ["/vanilla/notes/", "/vanilla/notes/page/{n}/"]
from = "vanilla_notes_set"
paginate = 2
layout = "listing"
content = "vanilla/notes/index.md"
title = "Notes"

[routes.ledger_notes_index]
paths = ["/ledger/notes/", "/ledger/notes/page/{n}/"]
from = "ledger_notes_set"
paginate = 2
layout = "listing"
content = "ledger/notes/index.md"
title = "Notes"

[routes.marginalia_notes_index]
paths = ["/marginalia/notes/", "/marginalia/notes/page/{n}/"]
from = "marginalia_notes_set"
paginate = 2
layout = "listing"
content = "marginalia/notes/index.md"
title = "Notes"

[routes.terminal_notes_index]
paths = ["/terminal/notes/", "/terminal/notes/page/{n}/"]
from = "terminal_notes_set"
paginate = 2
layout = "listing"
content = "terminal/notes/index.md"
title = "Notes"

[routes.atlas_notes_index]
paths = ["/atlas/notes/", "/atlas/notes/page/{n}/"]
from = "atlas_notes_set"
paginate = 2
layout = "listing"
content = "atlas/notes/index.md"
title = "Notes"

[routes.miroir_notes_index]
paths = ["/miroir/notes/", "/miroir/notes/page/{n}/"]
from = "miroir_notes_set"
paginate = 2
layout = "listing"
content = "miroir/notes/index.md"
title = "Notes"

# ---- the card face

[routes.vanilla_shelf_index]
path = "/vanilla/shelf/"
from = "vanilla_shelf"
layout = "listing"
variant = "cards"
featured = true
content = "vanilla/shelf/index.md"
title = "Shelf"

[routes.ledger_shelf_index]
path = "/ledger/shelf/"
from = "ledger_shelf"
layout = "listing"
variant = "cards"
featured = true
content = "ledger/shelf/index.md"
title = "Shelf"

[routes.marginalia_shelf_index]
path = "/marginalia/shelf/"
from = "marginalia_shelf"
layout = "listing"
variant = "cards"
featured = true
content = "marginalia/shelf/index.md"
title = "Shelf"

[routes.terminal_shelf_index]
path = "/terminal/shelf/"
from = "terminal_shelf"
layout = "listing"
variant = "cards"
featured = true
content = "terminal/shelf/index.md"
title = "Shelf"

[routes.atlas_shelf_index]
path = "/atlas/shelf/"
from = "atlas_shelf"
layout = "listing"
variant = "cards"
featured = true
content = "atlas/shelf/index.md"
title = "Shelf"

[routes.miroir_shelf_index]
path = "/miroir/shelf/"
from = "miroir_shelf"
layout = "listing"
variant = "cards"
featured = true
content = "miroir/shelf/index.md"
title = "Shelf"

# ---- the gallery face: objects, not pages, so all five share one image set

[routes.vanilla_wall]
path = "/vanilla/wall/"
from = "objects"
match = "wall/**"
order_by = "name"
layout = "listing"
variant = "gallery"
content = "vanilla/wall/index.md"
title = "Wall"

[routes.ledger_wall]
path = "/ledger/wall/"
from = "objects"
match = "wall/**"
order_by = "name"
layout = "listing"
variant = "gallery"
content = "ledger/wall/index.md"
title = "Wall"

[routes.marginalia_wall]
path = "/marginalia/wall/"
from = "objects"
match = "wall/**"
order_by = "name"
layout = "listing"
variant = "gallery"
content = "marginalia/wall/index.md"
title = "Wall"

[routes.terminal_wall]
path = "/terminal/wall/"
from = "objects"
match = "wall/**"
order_by = "name"
layout = "listing"
variant = "gallery"
content = "terminal/wall/index.md"
title = "Wall"

[routes.atlas_wall]
path = "/atlas/wall/"
from = "objects"
match = "wall/**"
order_by = "name"
layout = "listing"
variant = "gallery"
content = "atlas/wall/index.md"
title = "Wall"

[routes.miroir_wall]
path = "/miroir/wall/"
from = "objects"
match = "wall/**"
order_by = "name"
layout = "listing"
variant = "gallery"
content = "miroir/wall/index.md"
title = "Wall"

# ----------------------------------------------------------------- search

[routes.search]
path = "/search.bin"
from = "*"
shell = "search"
where = 'kind == "page" && !draft && !hidden && stem != "index"'

[routes.sitemap]
path = "/sitemap.xml"
from = "*"
shell = "sitemap"
where = '!draft && !hidden && (dir || ext == "html")'
