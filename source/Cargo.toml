[package]
name = "grackle-source"
version = "0.1.0"
edition = "2021"

[dependencies]
grackle-db = { path = "../db" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
ignore = "0.4"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "0.8"
walkdir = "2"
