# Paths are relative to this file's directory.
root = ".."

# Marker files declare defaults for their directory and everything below it
# (DESIGN.md §4b). The config says what a marker means; the tree says where.
# Precedence: front matter > nearest marker > rule.
[markers]
".noindex" = { noindex = true }
".hidden" = { hidden = true }
".draft" = { draft = true }

[site]
url = "https://grack.com"
baseurl = ""
title = "grack.com"
author = "Matt Mastracci"
email = "matthew@mastracci.com"

# ---------------------------------------------------------------- posts

[[collections]]
kind = "posts"
source = "_posts"
# What `next`/`previous` step through (q51). Naming the SET rather than
# leaning on the table's ordering means drafts drop by construction, not by
# the accident that a draft has no date — give one a date today and it
# becomes somebody's "later post".
adjacency = "published"
# A post's trail walks `trail`'s subdivision chain — Home > Blog > 2022 >
# December > 16, every archive level clickable. The Blog level itself is
# not declared here: the post's URL nests under /blog/, and the trail
# climbs to the landing that owns it (q46).
trail = "monthly_archive"
# Tried in order. Measured: all 327 posts use the first form; the legacy
# MM-DD-YYYY form that legacy_post_filename_dates.rb exists for is unused
# in _posts, but the format list costs nothing to keep.
filename_formats = ["{year}-{month}-{day}-{slug}", "{month}-{day}-{year}-{slug}"]

  [[collections.rules]]
  match = "hidden/**"
  defaults = { hidden = true }

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post" }
  route = "/blog/{year}/{month:02}/{day:02}/{slug}/"

# Drafts are a SECOND SOURCE for the one posts table, not a second table:
# same row shape, same schema, same views — flagged `draft`, which every
# view's `!draft` filter already excludes. Undated by Jekyll convention
# (`_drafts` filenames carry no date), so no `filename_formats` here.
[[collections]]
kind = "posts"
source = "_drafts"
# The whole stem is the slug: a draft has no date until it is published, so
# `{slug}` is the honest format rather than a date the file does not carry.
filename_formats = ["{slug}"]

  [[collections.rules]]
  match = "**"
  defaults = { layout = "post", draft = true }
  route = "/drafts/{slug}/"

# ---------------------------------------------------------------- objects

# Matched by extension anywhere in the tree; membership precedence is
# posts -> objects -> tree (DESIGN.md §3), so these never collide with the
# tree's passthrough rule.
[[collections]]
name = "objects"
kind = "objects"
extensions = ["png", "jpg", "jpeg", "gif", "webp", "svg", "ico"]
bucket = "assets"

  [[collections.rules]]
  match = "**"
  route = "/{path}"

# ---------------------------------------------------------------- pages

[[collections]]
kind = "tree"
source = "."

# Three layers, each doing what only it can:
#
#   1. .gitignore (top-level `gitignore = true`) covers every build artifact —
#      _site*, _log*, vendor, _cache, grackle/target, .jekyll-cache, workspace,
#      _tools/converter/target. All 10 verified already listed there, and they
#      are exactly the expensive subtrees. Self-maintaining: add a line to
#      .gitignore and grackle stops seeing it.
#   2. Jekyll's implicit dot/underscore skip covers _posts, _layouts, _sass, ...
#   3. This list, for what is tracked on purpose but still isn't content.
#      Nothing here is gitignored, so nothing here is a duplicate.
exclude = [
  "docker/**", "scripts/**", "CHANGES/**", "grackle/**", "node_modules/**", "themes/**",
  "Gemfile*", "*.sh", "TODO", "*.yml", "*.toml", "Rakefile", "LICENSE*",
]
# Re-added despite the dotfile rule (matches `include:` in _config.yml).
include = [".well-known/**", ".htaccess"]

  # An index file is served as its directory, whether it is rendered or static.
  [[collections.rules]]
  match = "**/index.{html,md}"
  route = "/{dir}/"

  # Sass with front matter is compiled, so the output extension changes.
  # css/main.scss -> /css/main.css, which the layout hardcodes.
  [[collections.rules]]
  match = "**/*.{scss,sass}"
  front_matter = true
  route = "/{dir}/{stem}.css"

  # Front matter is what makes a file a *page* in Jekyll; those get pretty
  # URLs. Measured: index.html and blog/index.html have front matter, while
  # everything under demos/, code/legacy/ and writing/school/ does not — which
  # is exactly why /demos/mindstorms/alpharex_1.html keeps its extension.
  [[collections.rules]]
  match = "**/*.{html,md}"
  front_matter = true
  route = "/{dir}/{stem}/"

  # Everything else is copied verbatim at its literal path.
  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

# ---------------------------------------------------------------- widgets

# Custom block widgets (§5d): {% name %}…{% endname %} expands to the wrapper
# with the body spliced at {body}, BEFORE markdown — the blank padding makes
# comrak parse the body as ordinary markdown (no kramdown markdown="1").
# The theme styles the wrapper element.
[widgets]
callout = """
<callout>
<div>

{body}

</div>
</callout>
"""

# ---------------------------------------------------------------- related

# Related posts (§6b): embedding cosine supplies candidates; this shapes
# them. Recency matters on a 27-year blog — a 2004 post is probably not
# relevant here (other sites may want no penalty at all). Scores are
# adjusted (cosine − year_penalty·gap) before min_score applies.
[related]
limit = 4
min_score = 0.4
year_penalty = 0.01

# --------------------------------------------------------------- profiles

# A profile is a different PROJECTION of the same database (§4a), never a
# different database: drafts load either way, and a profile only decides
# which views admit them, what URL space the output is addressed in, and
# what marker themes may style on. `dev` needs no entry — undeclared it
# changes nothing, which is what `serve` defaults to.
#
# v1 has no `baseurl`: it prefixes assets but not routes, so setting it per
# profile would relocate the stylesheet and leave every canonical URL
# pointing at the real site. That half of the address axis is punted.
#
# Deliberately NOT here, and not Jekyll's five configs: `exclude` (§4c owns
# what is content), per-profile `defaults` (collection rules own those),
# and a "fast" profile that skipped `code/` and `writing/` — that one
# existed because Jekyll took 38s, and a 0.4s build deleted its reason to
# exist rather than porting it.

[profiles.drafts]
noindex = true

  # Selection is the query's job: relax the one `where` that hides drafts and
  # every listing, archive and feed downstream follows, because they all
  # read `published`. Patching a SET patches a query...
  [profiles.drafts.sets.published]
  where = "!hidden"

  # ...and patching a ROUTE patches a landing. Its own search index too, or
  # the projection would ship a searchable set that disagrees with the pages
  # beside it.
  [profiles.drafts.routes.search]
  where = 'kind == "post" && !hidden'

# ------------------------------------------------------------------ sets
#
# A query that never lands. `from` names a collection, another set, or a
# route (composing over a routed, grouped query is SUBDIVISION, §5c — the
# engine derives which from what the name refers to, so there is one
# keyword and one namespace).

# The one named set. Jekyll had five hand-written `{% unless %}` clauses that
# had drifted into three different opinions: atom.xml excluded only `hidden`
# (so the feed shipped drafts), blog/index.html and tag_index.html excluded only
# `draft` (so both listed hidden posts), and only monthly_archive.html and
# index.html excluded both. Nobody decided that; it accreted. Transcribing it
# faithfully also meant transcribing a bug — this file had monthly_archive as
# `!draft`, dropping the `!hidden` its template actually had.
#
# Free to correct: the corpus has 0 drafts and 0 hidden posts, so no output
# moves today. It moves the first time a draft exists, which is the point.
[sets.published]
from = "posts"
where = "!draft && !hidden"
# Newest first. The engine orders by path unless a set says otherwise —
# a tree is a list of files, and dates are a thing posts have.
order_by = "-date"

  # A computed field (§6d): a derived column on this query's rows, inherited
  # by every query composed over it (nearest declaration wins). `summary` is
  # what listing previews consume — content blocks kept until a budget runs
  # out; the theme's fade clamps at ~7 lines, so max_chars tracks what is
  # actually visible. The deriver also yields the `truncated` fact (the ★).
  [sets.published.fields.summary]
  truncate = { max_blocks = 4, max_chars = 700 }

# No route: `/` embeds this one (DESIGN.md §5c). index.html counted to 3 by hand
# with `{% assign latest_count %}` because `site.posts | limit: 3` slices before
# it filters, so hidden posts would eat the slots. `where` and `limit` are
# separate stages here, so this says what it means.
[sets.latest]
from = "published"
limit = 3
layout = "link_list"

# ---------------------------------------------------------------- routes
#
# Every URL this site emits from a query. `path` is what makes an entry a
# route rather than a set; `title`, `crumb`, `shell`, `paginate` and
# `group_by` are meaningless without one, which is why they only appear here.

# `blog/index.html` iterates `paginator.posts`: jekyll-paginate renders that one
# file once per page. It is this view's template, not an independently routable
# page — so the view owns both routes and the tree collection skips the file.
[routes.blog_index]
paths = ["/blog/", "/blog/page/{n}/"]
from = "published"
paginate = 5
template = "blog/index.html"
layout = "listing"
title = "Blog"

[routes.feed]
path = "/atom.xml"
from = "published"
limit = 20
template = "atom.xml"
shell = "atom"

# The searchable set is a query (§5g): the same star shape as the sitemap,
# serialized as the postcard index /search.js consumes. Posts only for now —
# adding `|| kind == "page"` would make /code/ and /writing/ searchable, but
# that's a deliberate index change, not a mechanism default.
[routes.search]
path = "/search.bin"
from = "*"
shell = "search"
where = 'kind == "post" && !draft && !hidden'

# No source file: jekyll-sitemap generates this one outright.
#
# The filter is derived from the reference build, not from what jekyll-sitemap
# looks like it should do. Measured over its 556 URLs: 524 pretty dirs, 30
# .html, 2 .pdf — and nothing else. Specifically it does NOT respect `noindex`
# (the noindex'd tag pages are listed) and does NOT drop paginated pages (all
# 64 are listed), so keying on output type alone is the whole rule. Images,
# .css, .txt and .xml fall out by extension, which is also what keeps
# /atom.xml and /sitemap.xml itself off the list.
#
# `dir` is distinct from `ext == ""`: a directory URL outputs an index.html,
# whereas an extensionless *file* (code/legacy/nnet/nnet) outputs itself and is
# not a page. Keying on ext alone let four such binaries into the sitemap.
[routes.sitemap]
path = "/sitemap.xml"
from = "*"
shell = "sitemap"
# `!draft && !hidden` closes the leak §4a flagged: without it a future draft —
# routed into the main build today — lands in the most public URL there is,
# which is exactly the crawling problem this project exists to fix. Latent now
# (0 drafts/hidden), armed the moment one is written. `draft`/`hidden` are
# carried onto every Route (false for non-posts) so the filter can say this.
where = '!draft && !hidden && (dir || ext == "html" || ext == "pdf")'

[routes.tag_index]
path = "/blog/tags/{key}/"
from = "published"
group_by = "tags"
layout = "listing"
title = "Posts Tagged “{key}”"
crumb = "{key}"

# Year archives are new with grackle — the Jekyll site only ever had months,
# so `/blog/2010/` was a 404 between `/blog/` and `/blog/2010/01/`.
[routes.yearly_archive]
path = "/blog/{year}/"
from = "published"
group_by = "date.year"
layout = "listing"
title = "{year}"

# Subdivision (§5c): `from` a grouped ROUTE refines its partition, so this is
# GROUP BY year, month — the year key comes from the parent, and provenance
# for breadcrumb chains comes free: trails render as 2022 > December with the
# year linked to its own archive. One keyword, because what `from` names is
# what decides: a set selects, a grouped route subdivides.
[routes.monthly_archive]
path = "/blog/{year}/{month:02}/"
from = "yearly_archive"
group_by = "date.month"
layout = "listing"
title = "{year} {month_name}"
crumb = "{month_name}"
