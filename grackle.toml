# Paths are relative to this file's directory.
root = ".."

# Google Analytics (GA4), site-wide (§4e `include`). Cloudflare already injects
# its own Web Analytics beacon at the edge; this is the Google property, owned
# in-repo and emitted verbatim into every page's <head>.
[html.head]
include = ['''
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-STPMRBZ9Z1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-STPMRBZ9Z1');
</script>''']

[html.head.meta]
apple-mobile-web-app-title = 'site.title'
application-name = 'site.title'

# Marker files declare defaults for their directory and everything below it.

[markers]
".noindex" = { noindex = true }
".hidden" = { hidden = true }
".draft" = { draft = true }

[site]
url = "https://grack.com"
baseurl = ""
title = "grack.com"
author = "Matt Mastracci"
email = "matthew@mastracci.com"

# ---------------------------------------------------------------- posts

[[collections]]
source = "_posts"
# A post's trail walks `trail`'s subdivision chain — Home > Blog > 2022 >
# December > 16, every archive level clickable. The Blog level itself is
# not declared here: the post's URL nests under /blog/, and the trail
# climbs to the landing that owns it (q46).
trail = "monthly_archive"
# Only the first one is currently used
file = ["{date.year}-{date.month}-{date.day}-{slug}", "{date.month}-{date.day}-{date.year}-{slug}"]

  # A defaults-only rule scoping a directory, so it names no extension: what it
  # says is about where a file sits, not what kind it is. (It still CLAIMS what
  # it matches — IO.md I7d — so a non-markdown file under `_posts/hidden/`
  # would be a load error naming it rather than a silent skip. There is no such
  # directory today: this rule has governed no rows since it was written, and
  # the build says so on stderr.)
  [[collections.rules]]
  match = "hidden/**"
  defaults = { hidden = true }

  [[collections.rules]]
  match = "**/*.{md,markdown}"
  route = "/blog/{year}/{month:02}/{day:02}/{slug}/"

  # Related posts. Embedding cosine, minus a small recency penalty.
  [collections.relations.related]
  from     = "published"
  where    = "!(candidate in earlier) && !(candidate in later) && !(candidate in links_to)"
  rank     = "embedding_similarity(self, candidate) - 0.01 * year_gap(self, candidate)"
  min_rank = 0.4
  limit    = 4

# Drafts are a SECOND SOURCE for the one posts table, not a second table:
# same row shape, same schema, same views — flagged `draft`, which every
# view's `!draft` filter already excludes. Undated by Jekyll convention:
# `_drafts` filenames carry no date, so the base's dated format is not what
# this source wants and the line below replaces it.
[[collections]]
source = "_drafts"
# The whole stem is the slug: a draft has no date until it is published, so
# `{slug}` is the honest format rather than a date the file does not carry.
# It is the DEFAULT for this collection's rules (§4, IO.md I6) — a rule of its
# own may name another, and none here does.
file = ["{slug}"]

  # The rule's glob names the extensions this scope claims, and here that is
  # load-bearing rather than tidy: `_drafts/caret/` holds a draft and eighteen
  # files beside it — fifteen images the draft cites with relative paths, an
  # `.rtf` and an `.xcf`. **A scope owns its source** (IO.md I7d), so what this
  # rule does not claim is not content at all: not objects, not byte copies,
  # nothing. Widen this glob and the bundle joins the site.

  # `shell = "html"` because this collection pairs with nothing in the base:
  # `_posts` merges with the base's posts collection and inherits its
  # `defaults = { shell = "html" }`, while this second source has no base twin
  # to inherit from, so its rows resolved no shell at all and reached the
  # themed rendering through the renderer's legacy `layout:` fallback. Saying
  # it here is what makes the drafts' serialization a declared fact like every
  # other row's (IO.md §4, "defaults are declared, not built in") — and it is
  # what the rendering law reads, since a draft may carry no front-matter
  # block at all (IO.md I7c: `front_mattered || shell ∈ {html, light_html}`).
  [[collections.rules]]
  match = "**/*.{md,markdown}"
  defaults = { draft = true, shell = "html" }
  route = "/drafts/{slug}/"

# ---------------------------------------------------------------- objects

# Claimed by these rules' globs anywhere in the walk.
[[collections]]
name = "objects"

  # Browser-convention assets: a favicon or a touch icon is fetched by URL
  # with nothing on the site linking it, so it cannot be reference-driven.
  # Eager rules sit ABOVE the on-demand catch-all and win by first-writer
  # (§4) — which is the whole reason the overlap check is scoped to
  # on-demand rules only.
  [[collections.rules]]
  match = "resource/**/*.{png,jpg,jpeg,gif,webp,svg,ico}"
  route = "/{path}"
  defaults = { shell = "raw" }

  # Frozen legacy subtrees. These are hand-written pages from 1996 onward
  # citing their assets in markup the reference scan does not read and never
  # will — `<body background=…>`, imagemaps, framesets — and none of it is
  # going to change again. Publishing them wholesale is cheaper and more
  # honest than teaching the scanner twenty years of dead HTML dialects.
  [[collections.rules]]
  match = "{code,demos,writing}/**/*.{png,jpg,jpeg,gif,webp,svg,ico}"
  route = "/{path}"
  defaults = { shell = "raw" }

  # §4 on-demand: an image publishes at its literal path when something
  # references it. The template still says WHERE, so `{% image %}` and every
  # authored link resolve before anything materializes.
  [[collections.rules]]
  match = "**/*.{png,jpg,jpeg,gif,webp,svg,ico}"
  route = "/{path}"
  on_demand = true
  defaults = { shell = "raw" }

# ---------------------------------------------------------------- pages

[[collections]]
source = "."

exclude = [
  "docker/**", "scripts/**", "CHANGES/**", "grackle/**", "node_modules/**", "themes/**",
  "Gemfile*", "*.sh", "TODO", "*.yml", "*.toml", "Rakefile", "LICENSE*",
]
# Re-added despite the dotfile rule
include = [".well-known/**", ".htaccess"]

  # An index file is served as its directory, whether it is rendered or static.
  [[collections.rules]]
  match = "**/index.{html,md}"
  route = "/{dir}/"

  # Front matter is what makes a file a *page* in Jekyll; those get pretty
  # URLs. Measured: index.html and blog/index.html have front matter, while
  # everything under demos/, code/legacy/ and writing/school/ does not — which
  # is exactly why /demos/mindstorms/alpharex_1.html keeps its extension.
  [[collections.rules]]
  match = "**/*.{html,md}"
  front_matter = true
  route = "/{dir}/{stem}/"

  # Everything else is copied verbatim at its literal path.
  [[collections.rules]]
  match = "**/*"
  route = "/{path}"

# ---------------------------------------------------------------- widgets

# Custom block widgets (§5d): {% name %}…{% endname %} expands to the wrapper
# with the body spliced at {body}, BEFORE markdown — the blank padding makes
# comrak parse the body as ordinary markdown (no kramdown markdown="1").
# The theme styles the wrapper element.
[widgets]
callout = """
<callout>
<div>

{body}

</div>
</callout>
"""

# --------------------------------------------------------------- profiles

[profiles.drafts]

  [profiles.drafts.force]
  noindex = true

  # Selection is the query's job: relax the one `where` that hides drafts and
  # every listing, archive and feed downstream follows, because they all read
  # `published`.
  #
  # Both entries below are FULL RESTATEMENTS of the definitions further down
  # this file.
  [profiles.drafts.sets.published]
  from = ["posts", "drafts"]
  where = "!hidden"
  order_by = "-date"

    [profiles.drafts.sets.published.fields]
    summary = 'truncate_chars(truncate_blocks(content, 4), 700)'
    hero = 'cover ? cover : image ? image : images(content)[0]'

  [profiles.drafts.routes.search]
  path = "/search.bin"
  shell = "search"
  where = 'kind == "post" && !hidden'

# ------------------------------------------------------------------ sets
#

# The one named set.
[sets.published]
from = ["posts", "drafts"]
where = "!draft && !hidden"
# Newest first. The engine orders by path unless a set says otherwise —
# a tree is a list of files, and dates are a thing posts have.
order_by = "-date"

  # A computed field (§6d / §5f): a derived column on this query's rows,
  # inherited by every query composed over it (nearest declaration wins).
  # `summary` is what listing previews consume — content blocks kept until a
  # budget runs out; the theme's fade clamps at ~7 lines, so truncate_chars
  # tracks what is actually visible. The wrappers yield the `truncated` fact
  # (the ★) on the Content value.
  [sets.published.fields]
  summary = 'truncate_chars(truncate_blocks(content, 4), 700)'

# No route: `/` embeds this one (DESIGN.md §5c). index.html counted to 3 by hand
# with `{% assign latest_count %}` because `site.posts | limit: 3` slices before
# it filters, so hidden posts would eat the slots. `where` and `limit` are
# separate stages here, so this says what it means.
[sets.latest]
from = "published"
limit = 3
layout = "link"

# ---------------------------------------------------------------- routes
#
# Every URL this site emits from a query. `path` is what makes an entry a
# route rather than a set; `title`, `crumb`, `shell`, `paginate` and
# `group_by` are meaningless without one, which is why they only appear here.

[routes.blog_index]
paths = ["/blog/", "/blog/page/{n}/"]
from = "published"
paginate = 5
layout = "card"
title = "Blog"

[routes.feed]
path = "/atom.xml"
from = "published"
limit = 20
shell = "atom"

# The searchable set is a query: the same shape as the sitemap.
[routes.search]
path = "/search.bin"
shell = "search"
where = 'kind == "post" && !draft && !hidden'

# `dir` is distinct from `ext == ""`: a directory URL outputs an index.html,
# whereas an extensionless *file* (code/legacy/nnet/nnet) outputs itself and is
# not a page. Keying on ext alone let four such binaries into the sitemap.
[routes.sitemap]
path = "/sitemap.xml"
shell = "sitemap"
where = '!draft && !hidden && (dir || ext == "html" || ext == "pdf")'

[routes.tag_index]
path = "/blog/tags/{key}/"
from = "published"
group_by = "tags"
layout = "card"
noindex = true
title = "Posts Tagged “{key}”"
crumb = "{key}"

[routes.yearly_archive]
path = "/blog/{year}/"
from = "published"
group_by = "date.year"
layout = "card"
noindex = true
title = "{year}"

# Subdivision.
[routes.monthly_archive]
path = "/blog/{year}/{month:02}/"
from = "yearly_archive"
group_by = "date.month"
layout = "card"
noindex = true
title = "{year} @months[{month}]"
crumb = "@months[{month}]"
