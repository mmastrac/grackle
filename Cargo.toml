[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [
    "crates/grackle",
    "crates/db",
    "crates/model",
    "crates/source",
    "crates/search-core",
]

# Versions live here so five manifests cannot drift apart on one dependency.
[workspace.dependencies]
grackle-db = { path = "crates/db" }
grackle-model = { path = "crates/model" }
grackle-search-core = { path = "crates/search-core" }
grackle-source = { path = "crates/source" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
ignore = "0.4"
postcard = { version = "1", features = ["alloc"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "0.8"
walkdir = "2"

[profile.release]
opt-level = 3

# Small wasm: the search blob ships to browsers, so it optimizes for size.
[profile.release.package.grackle-search-wasm]
opt-level = "z"
